<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="[placeholder descripción SEO de la productora]">
  <title>Productora | Home</title>

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/index.css">
</head>
<body>

  <header class="site-header">
    <div class="container">

      <a href="index.html" class="site-logo" aria-label="Ir al inicio">
        <img
          src="https://placehold.co/160x48"
          alt="Logo Productora"
          width="160"
          height="48"
        >
      </a>

      <nav id="site-nav" class="site-nav" aria-label="Navegación principal">
        <ul class="site-nav__list">
          <li class="site-nav__item site-nav__item--active">
            <a href="index.html" class="site-nav__link" data-lang-key="nav.home"></a>
          </li>
          <li class="site-nav__item">
            <a href="servicios.html" class="site-nav__link" data-lang-key="nav.services"></a>
          </li>
          <li class="site-nav__item">
            <a href="quienes-somos.html" class="site-nav__link" data-lang-key="nav.about"></a>
          </li>
          <li class="site-nav__item">
            <a href="contacto.html" class="site-nav__link" data-lang-key="nav.contact"></a>
          </li>
        </ul>
      </nav>

      <div class="site-header__actions">
        <button
          class="lang-switcher"
          aria-label="Cambiar idioma"
          data-lang-key="nav.langToggle"
        ></button>
        <button
          class="nav-toggle"
          aria-label="Abrir menú"
          aria-expanded="false"
          aria-controls="site-nav"
        >
          <span class="nav-toggle__bar"></span>
          <span class="nav-toggle__bar"></span>
          <span class="nav-toggle__bar"></span>
        </button>
      </div>

    </div>
  </header>

  <main id="main-content">

    <section class="hero" aria-labelledby="hero-title">
      <div class="container">
        <div class="hero__content">
          <h1 id="hero-title" class="hero__title" data-lang-key="home.hero.title"></h1>
          <p class="hero__subtitle" data-lang-key="home.hero.subtitle"></p>
          <div class="hero__actions">
            <a href="servicios.html" class="btn btn--primary" data-lang-key="home.hero.cta.services"></a>
            <a href="contacto.html" class="btn btn--secondary" data-lang-key="home.hero.cta.contact"></a>
          </div>
        </div>
        <div class="hero__media">
          <img
            src="https://picsum.photos/800/600"
            alt="Imagen hero productora"
            width="800"
            height="600"
            class="hero__image"
          >
        </div>
      </div>
    </section>

    <section class="services-preview" aria-labelledby="services-preview-title">
      <div class="container">
        <h2 id="services-preview-title" class="section-title" data-lang-key="home.services.title"></h2>
        <p class="section-subtitle" data-lang-key="home.services.subtitle"></p>
        <ul class="services-preview__grid">
          <li class="service-card">
            <div class="service-card__media">
              <img
                src="https://placehold.co/400x300"
                alt="Servicio 1"
                width="400"
                height="300"
                class="service-card__image"
              >
            </div>
            <div class="service-card__body">
              <h3 class="service-card__title" data-lang-key="home.services.item1.title"></h3>
              <p class="service-card__description" data-lang-key="home.services.item1.description"></p>
            </div>
          </li>
          <li class="service-card">
            <div class="service-card__media">
              <img
                src="https://placehold.co/400x300"
                alt="Servicio 2"
                width="400"
                height="300"
                class="service-card__image"
              >
            </div>
            <div class="service-card__body">
              <h3 class="service-card__title" data-lang-key="home.services.item2.title"></h3>
              <p class="service-card__description" data-lang-key="home.services.item2.description"></p>
            </div>
          </li>
          <li class="service-card">
            <div class="service-card__media">
              <img
                src="https://placehold.co/400x300"
                alt="Servicio 3"
                width="400"
                height="300"
                class="service-card__image"
              >
            </div>
            <div class="service-card__body">
              <h3 class="service-card__title" data-lang-key="home.services.item3.title"></h3>
              <p class="service-card__description" data-lang-key="home.services.item3.description"></p>
            </div>
          </li>
        </ul>
        <div class="services-preview__footer">
          <a href="servicios.html" class="btn btn--outline" data-lang-key="home.services.cta"></a>
        </div>
      </div>
    </section>

    <section class="about-preview" aria-labelledby="about-preview-title">
      <div class="container">
        <div class="about-preview__media">
          <img
            src="https://picsum.photos/600/400"
            alt="Quiénes somos"
            width="600"
            height="400"
            class="about-preview__image"
          >
        </div>
        <div class="about-preview__content">
          <h2 id="about-preview-title" class="section-title" data-lang-key="home.about.title"></h2>
          <p class="about-preview__text" data-lang-key="home.about.description"></p>
          <a href="quienes-somos.html" class="btn btn--primary" data-lang-key="home.about.cta"></a>
        </div>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="site-footer__brand">
        <a href="index.html" class="site-logo" aria-label="Ir al inicio">
          <img
            src="https://placehold.co/120x36"
            alt="Logo Productora"
            width="120"
            height="36"
          >
        </a>
        <p class="site-footer__tagline" data-lang-key="footer.tagline"></p>
      </div>
      <nav class="site-footer__nav" aria-label="Navegación del pie de página">
        <ul class="site-footer__nav-list">
          <li class="site-footer__nav-item">
            <a href="index.html" class="site-footer__nav-link" data-lang-key="nav.home"></a>
          </li>
          <li class="site-footer__nav-item">
            <a href="servicios.html" class="site-footer__nav-link" data-lang-key="nav.services"></a>
          </li>
          <li class="site-footer__nav-item">
            <a href="quienes-somos.html" class="site-footer__nav-link" data-lang-key="nav.about"></a>
          </li>
          <li class="site-footer__nav-item">
            <a href="contacto.html" class="site-footer__nav-link" data-lang-key="nav.contact"></a>
          </li>
        </ul>
      </nav>
      <div class="site-footer__legal">
        <p class="site-footer__copyright" data-lang-key="footer.copyright"></p>
      </div>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
