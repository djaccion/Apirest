<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self';
                 style-src 'self';
                 img-src 'self' https://flagcdn.com;
                 object-src 'none'">
  <title>Hola TSOFT</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">

    <header class="header">
      <h1 class="header__title">Saludos desde TSOFT</h1>
    </header>

    <main>

      <div id="country-dropdown" class="dropdown">

        <button class="dropdown__toggle" aria-haspopup="listbox" aria-expanded="false">
          <span class="dropdown__toggle-flag" aria-hidden="true"></span>
          <span class="dropdown__toggle-label">Selecciona un país</span>
        </button>

        <ul class="dropdown__menu" role="listbox" aria-label="Selecciona el país de tu oficina">

          <li class="dropdown__item"
              role="option"
              data-country-id="mexico"
              data-lang="es-MX">
            <span class="dropdown__item-flag" aria-hidden="true"></span>
            <span class="dropdown__item-name">México</span>
          </li>

          <li class="dropdown__item"
              role="option"
              data-country-id="colombia"
              data-lang="es-CO">
            <span class="dropdown__item-flag" aria-hidden="true"></span>
            <span class="dropdown__item-name">Colombia</span>
          </li>

          <li class="dropdown__item"
              role="option"
              data-country-id="argentina"
              data-lang="es-AR">
            <span class="dropdown__item-flag" aria-hidden="true"></span>
            <span class="dropdown__item-name">Argentina</span>
          </li>

          <li class="dropdown__item"
              role="option"
              data-country-id="chile"
              data-lang="es-CL">
            <span class="dropdown__item-flag" aria-hidden="true"></span>
            <span class="dropdown__item-name">Chile</span>
          </li>

          <li class="dropdown__item"
              role="option"
              data-country-id="peru"
              data-lang="es-PE">
            <span class="dropdown__item-flag" aria-hidden="true"></span>
            <span class="dropdown__item-name">Perú</span>
          </li>

          <li class="dropdown__item"
              role="option"
              data-country-id="españa"
              data-lang="es-ES">
            <span class="dropdown__item-flag" aria-hidden="true"></span>
            <span class="dropdown__item-name">España</span>
          </li>

          <li class="dropdown__item"
              role="option"
              data-country-id="usa"
              data-lang="en-US">
            <span class="dropdown__item-flag" aria-hidden="true"></span>
            <span class="dropdown__item-name">USA</span>
          </li>

        </ul>
      </div>

      <section id="greeting-display" class="greeting">
        <p class="greeting__flag" aria-hidden="true"></p>
        <p class="greeting__phrase"></p>
        <p class="greeting__country"></p>
      </section>

    </main>

    <footer class="footer">
      <p>© TSOFT — Todos los derechos reservados</p>
    </footer>

  </div>
  <script src="js/main.js"></script>
</body>
</html>
