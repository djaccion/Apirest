<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self'; script-src 'self';">
  <meta name="description" content="Saludos desde las oficinas TSOFT en Latinoamérica">
  <title>Hola TSOFT</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header id="site-header" class="site-header">
    <h1 id="main-title">Saludos desde TSOFT</h1>
  </header>

  <main>

    <div id="country-dropdown">

      <button id="dropdown-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
        Selecciona un país
      </button>

      <ul id="dropdown-list" role="listbox" aria-label="Países TSOFT">

        <li class="dropdown-item" role="option" data-country="argentina" aria-selected="false">
          <span class="dropdown-item__flag" aria-hidden="true">🇦🇷</span>
          <span class="dropdown-item__name">Argentina</span>
        </li>

        <li class="dropdown-item" role="option" data-country="mexico" aria-selected="false">
          <span class="dropdown-item__flag" aria-hidden="true">🇲🇽</span>
          <span class="dropdown-item__name">México</span>
        </li>

        <li class="dropdown-item" role="option" data-country="colombia" aria-selected="false">
          <span class="dropdown-item__flag" aria-hidden="true">🇨🇴</span>
          <span class="dropdown-item__name">Colombia</span>
        </li>

        <li class="dropdown-item" role="option" data-country="chile" aria-selected="false">
          <span class="dropdown-item__flag" aria-hidden="true">🇨🇱</span>
          <span class="dropdown-item__name">Chile</span>
        </li>

        <li class="dropdown-item" role="option" data-country="peru" aria-selected="false">
          <span class="dropdown-item__flag" aria-hidden="true">🇵🇪</span>
          <span class="dropdown-item__name">Perú</span>
        </li>

        <li class="dropdown-item" role="option" data-country="uruguay" aria-selected="false">
          <span class="dropdown-item__flag" aria-hidden="true">🇺🇾</span>
          <span class="dropdown-item__name">Uruguay</span>
        </li>

      </ul>
    </div>

    <section id="greeting-display" class="greeting-card">
      <span id="greeting-flag" aria-hidden="true"></span>
      <p id="greeting-text"></p>
      <span id="greeting-country"></span>
    </section>

  </main>

  <script src="js/main.js"></script>
</body>
</html>
