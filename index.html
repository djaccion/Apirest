<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Validador de Prompts y Tokens</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">

  <div class="max-w-2xl w-full mx-auto px-4 py-10">

    <!-- CABECERA -->
    <div class="mb-8 text-center">
      <h1 class="text-3xl font-bold text-gray-800">Validador de Prompts y Tokens</h1>
      <p class="text-sm text-gray-500 mt-2">Analiza tu prompt, estima tokens y verifica su estado de optimización.</p>
    </div>

    <!-- TARJETA PRINCIPAL -->
    <div class="bg-white rounded-2xl shadow-md p-8">

      <label for="prompt-input" class="block font-semibold text-gray-700 mb-2">Tu Prompt</label>

      <textarea
        id="prompt-input"
        class="w-full min-h-[144px] border border-gray-300 rounded-xl p-3 resize-none focus:border-blue-500 focus:outline-none transition-colors"
        placeholder="Escribe o pega tu prompt aquí..."
      ></textarea>

      <p id="error-msg" class="hidden text-sm text-red-500 mt-1"></p>

      <button
        id="submit-btn"
        class="w-full mt-5 bg-blue-600 text-white font-semibold py-3 rounded-xl transition-colors hover:bg-blue-700"
      >
        Analizar Prompt
      </button>

    </div>

    <!-- PANEL DE RESULTADOS -->
    <div id="results-panel" class="hidden mt-6">
      <div class="grid grid-cols-3 gap-4">

        <!-- Palabras -->
        <div class="bg-white shadow-md rounded-xl p-4 text-center">
          <p class="text-xs text-gray-400 uppercase tracking-wide mb-1">Palabras</p>
          <p id="result-words" class="text-2xl font-bold text-gray-800">—</p>
        </div>

        <!-- Tokens -->
        <div class="bg-white shadow-md rounded-xl p-4 text-center">
          <p class="text-xs text-gray-400 uppercase tracking-wide mb-1">Tokens Est.</p>
          <p id="result-tokens" class="text-2xl font-bold text-gray-800">—</p>
        </div>

        <!-- Estado -->
        <div class="bg-white shadow-md rounded-xl p-4 text-center">
          <p class="text-xs text-gray-400 uppercase tracking-wide mb-1">Estado</p>
          <p id="result-status" class="text-2xl font-bold text-gray-800">—</p>
        </div>

      </div>
    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {

      // ─── 1. REFERENCIAS AL DOM ───────────────────────────────────────────────
      const promptInput   = document.getElementById('prompt-input');
      const submitBtn     = document.getElementById('submit-btn');
      const errorMsg      = document.getElementById('error-msg');
      const resultsPanel  = document.getElementById('results-panel');
      const resultWords   = document.getElementById('result-words');
      const resultTokens  = document.getElementById('result-tokens');
      const resultStatus  = document.getElementById('result-status');

      // ─── 2. HELPERS DE ESTADO DE UI ─────────────────────────────────────────

      function setError(message) {
        errorMsg.textContent = message;
        errorMsg.classList.remove('hidden');
        promptInput.classList.add('border-red-500');
        promptInput.classList.remove('border-gray-300');
      }

      function clearError() {
        errorMsg.textContent = '';
        errorMsg.classList.add('hidden');
        promptInput.classList.remove('border-red-500');
        promptInput.classList.add('border-gray-300');
      }

      function setLoading(isLoading) {
        if (isLoading) {
          submitBtn.disabled = true;
          submitBtn.textContent = 'Analizando...';
          submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
        } else {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Analizar Prompt';
          submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        }
      }

      function renderResults(data) {
        resultWords.textContent  = data.word_count;
        resultTokens.textContent = data.token_count;
        resultStatus.textContent = data.status;

        // Color dinámico del estado
        resultStatus.classList.remove('text-green-600', 'text-yellow-500', 'text-gray-800');
        if (data.status === 'Óptimo') {
          resultStatus.classList.add('text-green-600');
        } else {
          resultStatus.classList.add('text-yellow-500');
        }

        resultsPanel.classList.remove('hidden');
      }

      // ─── 3. VALIDACIÓN CLIENT-SIDE ──────────────────────────────────────────

      function validateInput(text) {
        if (!text || text.trim().length === 0) {
          return 'El prompt no puede estar vacío.';
        }
        if (text.trim().length < 3) {
          return 'El prompt debe tener al menos 3 caracteres.';
        }
        return null;
      }

      // ─── 4. LLAMADA A LA API ─────────────────────────────────────────────────

      async function analyzePrompt(promptText) {
        const response = await fetch('http://localhost:8000/api/analyze', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ prompt: promptText }),
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          throw new Error(errorData.detail || `Error del servidor: ${response.status}`);
        }

        return response.json();
      }

      // ─── 5. MANEJADOR DEL EVENTO SUBMIT ─────────────────────────────────────

      submitBtn.addEventListener('click', async () => {
        const promptText = promptInput.value;

        // Validación client-side (fail-fast)
        const validationError = validateInput(promptText);
        if (validationError) {
          setError(validationError);
          resultsPanel.classList.add('hidden');
          return;
        }

        clearError();
        setLoading(true);

        try {
          const data = await analyzePrompt(promptText.trim());
          renderResults(data);
        } catch (err) {
          setError(`No se pudo conectar con el servidor. Verifica que el backend esté activo. (${err.message})`);
          resultsPanel.classList.add('hidden');
        } finally {
          setLoading(false);
        }
      });

      // ─── 6. LIMPIAR ERROR AL ESCRIBIR ────────────────────────────────────────

      promptInput.addEventListener('input', () => {
        if (!errorMsg.classList.contains('hidden')) {
          clearError();
        }
      });

    });
  </script>

</body>
</html>
