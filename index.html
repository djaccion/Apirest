<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de Prompts y Tokens - DevSecOps Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .textarea-error {
            border-color: #ef4444 !important;
            box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.25);
        }

        .estado-optimo {
            color: #4ade80;
        }

        .estado-alerta {
            color: #facc15;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-900 flex items-center justify-center p-4">

    <div class="w-full max-w-3xl bg-slate-800 rounded-2xl shadow-2xl p-8">

        <!-- Encabezado -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-100 mb-2">Validador de Prompts y Tokens</h1>
            <p class="text-slate-400 text-sm">Analiza tu prompt, estima el consumo de tokens y evalúa la latencia del servidor en tiempo real.</p>
        </header>

        <!-- Formulario -->
        <form id="form-analisis" novalidate>
            <div class="mb-5">
                <label for="textarea-prompt" class="block text-slate-300 text-sm font-medium tracking-widest uppercase mb-2">
                    Ingresa tu Prompt
                </label>
                <textarea
                    id="textarea-prompt"
                    rows="5"
                    class="w-full bg-slate-900 text-slate-100 border border-slate-600 rounded-lg p-4 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent resize-y transition-all duration-200"
                    placeholder="Escribe aquí el prompt que deseas analizar..."
                ></textarea>
            </div>

            <button
                id="btn-submit"
                type="submit"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-lg transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
            >
                <svg
                    id="spinner"
                    class="hidden animate-spin h-4 w-4 text-white"
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                >
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 12 0 12 4.418A8.001 8.001 0 014 12z"></path>
                </svg>
                <span id="btn-texto">Analizar Prompt</span>
            </button>
        </form>

        <!-- Panel de Resultados -->
        <div id="panel-resultados" class="hidden mt-8">
            <h2 class="text-slate-400 text-xs font-semibold tracking-widest uppercase mb-4">Resultados del análisis</h2>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">

                <!-- Tarjeta Tokens -->
                <div class="bg-slate-900 border border-slate-700 rounded-xl p-5">
                    <p class="text-slate-400 text-xs font-semibold tracking-widest uppercase mb-2">Tokens Estimados</p>
                    <p id="valor-tokens" class="text-2xl font-bold text-indigo-400">—</p>
                </div>

                <!-- Tarjeta Latencia -->
                <div class="bg-slate-900 border border-slate-700 rounded-xl p-5">
                    <p class="text-slate-400 text-xs font-semibold tracking-widest uppercase mb-2">Latencia del Servidor</p>
                    <p id="valor-latencia" class="text-2xl font-bold text-indigo-400">—</p>
                </div>

                <!-- Tarjeta Estado -->
                <div class="bg-slate-900 border border-slate-700 rounded-xl p-5">
                    <p class="text-slate-400 text-xs font-semibold tracking-widest uppercase mb-2">Estado del Prompt</p>
                    <p id="valor-estado" class="text-2xl font-bold">—</p>
                </div>

            </div>
        </div>

        <!-- Panel de Error de Red -->
        <div id="panel-error" class="hidden mt-6 bg-red-950 border border-red-700 rounded-xl p-4">
            <p class="text-red-300 text-sm font-medium">
                <span class="font-bold uppercase tracking-wide text-red-400">Error: </span>
                <span id="mensaje-error">Ha ocurrido un error inesperado.</span>
            </p>
        </div>

    </div>

    <script>
        // 1. Referencias al DOM
        const formAnalisis = document.getElementById('form-analisis');
        const textareaPrompt = document.getElementById('textarea-prompt');
        const btnSubmit = document.getElementById('btn-submit');
        const btnTexto = document.getElementById('btn-texto');
        const spinner = document.getElementById('spinner');
        const panelResultados = document.getElementById('panel-resultados');
        const panelError = document.getElementById('panel-error');
        const mensajeError = document.getElementById('mensaje-error');
        const valorTokens = document.getElementById('valor-tokens');
        const valorLatencia = document.getElementById('valor-latencia');
        const valorEstado = document.getElementById('valor-estado');

        // 2. Función de utilidad resetUI
        function resetUI() {
            panelResultados.classList.add('hidden');
            panelError.classList.add('hidden');
            textareaPrompt.classList.remove('textarea-error');
            btnTexto.textContent = 'Analizar Prompt';
            btnSubmit.disabled = false;
            spinner.classList.add('hidden');
        }

        // 3. Función setLoading
        function setLoading(isLoading) {
            if (isLoading) {
                btnSubmit.disabled = true;
                btnTexto.textContent = 'Analizando...';
                spinner.classList.remove('hidden');
            } else {
                btnSubmit.disabled = false;
                btnTexto.textContent = 'Analizar Prompt';
                spinner.classList.add('hidden');
            }
        }

        // 4. Función renderResultados
        function renderResultados(data) {
            valorTokens.textContent = data.tokens_estimados;
            valorLatencia.textContent = data.latencia_ms + ' ms';

            valorEstado.textContent = data.estado;
            valorEstado.classList.remove('estado-optimo', 'estado-alerta');

            if (data.estado === 'Óptimo') {
                valorEstado.classList.add('estado-optimo');
            } else {
                valorEstado.classList.add('estado-alerta');
            }

            panelError.classList.add('hidden');
            panelResultados.classList.remove('hidden');
        }

        // 5. Función showError
        function showError(mensaje) {
            mensajeError.textContent = mensaje;
            panelResultados.classList.add('hidden');
            panelError.classList.remove('hidden');
        }

        // 6. Handler del formulario
        formAnalisis.addEventListener('submit', async function (e) {
            e.preventDefault();

            resetUI();

            const promptValue = textareaPrompt.value.trim();

            if (!promptValue) {
                textareaPrompt.classList.add('textarea-error');
                textareaPrompt.focus();
                return;
            }

            setLoading(true);

            try {
                const response = await fetch('http://localhost:8000/api/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ prompt: promptValue })
                });

                if (!response.ok) {
                    let errorMsg = `Error del servidor: ${response.status} ${response.statusText}`;
                    try {
                        const errorData = await response.json();
                        if (errorData.detail) {
                            errorMsg = typeof errorData.detail === 'string'
                                ? errorData.detail
                                : JSON.stringify(errorData.detail);
                        }
                    } catch (_) {}
                    showError(errorMsg);
                    return;
                }

                const data = await response.json();
                renderResultados(data);

            } catch (error) {
                if (error instanceof TypeError && error.message.includes('fetch')) {
                    showError('No se pudo conectar con el servidor. Verifica que el backend esté corriendo en http://localhost:8000.');
                } else {
                    showError(`Error inesperado: ${error.message}`);
                }
            } finally {
                setLoading(false);
            }
        });
    </script>

</body>
</html>
