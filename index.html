<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validador de Prompts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
  </style>
</head>
<body class="bg-gray-900 min-h-screen">

  <div class="max-w-2xl mx-auto py-12 px-4">

    <h1 class="text-3xl font-bold text-white mb-2">Validador de Prompts &amp; Tokens</h1>
    <p class="text-gray-400 mb-8">Estima tokens y latencia antes de integrar al orquestador.</p>

    <div class="bg-gray-800 rounded-2xl p-6 mb-6">
      <label for="prompt-input" class="block text-sm font-medium text-gray-300 mb-2">Prompt a analizar</label>
      <textarea
        id="prompt-input"
        rows="6"
        placeholder="Escribe o pega tu prompt aquí..."
        class="w-full bg-gray-700 text-white rounded-xl p-4 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-indigo-500 border border-gray-600"
      ></textarea>
      <div class="flex justify-between items-center mt-4">
        <span id="char-counter" class="text-xs text-gray-500">0 caracteres</span>
        <button
          id="analyze-btn"
          class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-6 rounded-xl transition-colors duration-200 flex items-center gap-2"
        >
          <span id="btn-spinner" class="hidden"><span class="spinner"></span></span>
          Analizar Prompt
        </button>
      </div>
    </div>

    <div id="results-section" class="hidden">
      <h2 class="text-lg font-semibold text-white mb-4">Resultados del Análisis</h2>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">

        <div class="bg-gray-800 rounded-2xl p-5 flex flex-col gap-1">
          <span class="text-xs font-medium text-gray-400 uppercase tracking-wide">Tokens Estimados</span>
          <span id="result-tokens" class="text-3xl font-bold text-white">—</span>
          <span class="text-xs text-gray-500">palabras × 1.3</span>
        </div>

        <div class="bg-gray-800 rounded-2xl p-5 flex flex-col gap-1">
          <span class="text-xs font-medium text-gray-400 uppercase tracking-wide">Latencia Simulada</span>
          <span id="result-latency" class="text-3xl font-bold text-white">—</span>
          <span class="text-xs text-gray-500">milisegundos</span>
        </div>

        <div class="bg-gray-800 rounded-2xl p-5 flex flex-col gap-1">
          <span class="text-xs font-medium text-gray-400 uppercase tracking-wide">Estado</span>
          <span id="result-status" class="text-3xl font-bold text-white">—</span>
          <span class="text-xs text-gray-500">tokens &gt; 1000 = Alerta</span>
        </div>

      </div>

      <div id="error-banner" class="hidden mt-4 bg-red-900 border border-red-700 text-red-300 rounded-xl p-4 text-sm"></div>
    </div>

  </div>

  <script>
    const textarea = document.getElementById('prompt-input');
    const charCounter = document.getElementById('char-counter');
    const analyzeBtn = document.getElementById('analyze-btn');
    const btnSpinner = document.getElementById('btn-spinner');
    const resultsSection = document.getElementById('results-section');
    const resultTokens = document.getElementById('result-tokens');
    const resultLatency = document.getElementById('result-latency');
    const resultStatus = document.getElementById('result-status');
    const errorBanner = document.getElementById('error-banner');

    textarea.addEventListener('input', function () {
      charCounter.textContent = textarea.value.length + ' caracteres';
    });

    function setLoading(isLoading) {
      if (isLoading) {
        btnSpinner.classList.remove('hidden');
        analyzeBtn.disabled = true;
        analyzeBtn.classList.add('opacity-70', 'cursor-not-allowed');
      } else {
        btnSpinner.classList.add('hidden');
        analyzeBtn.disabled = false;
        analyzeBtn.classList.remove('opacity-70', 'cursor-not-allowed');
      }
    }

    function showError(message) {
      errorBanner.textContent = message;
      errorBanner.classList.remove('hidden');
    }

    function hideError() {
      errorBanner.classList.add('hidden');
      errorBanner.textContent = '';
    }

    function applyStatusColor(statusEl, status) {
      statusEl.classList.remove('text-green-400', 'text-yellow-400', 'text-white');
      if (status === 'Óptimo') {
        statusEl.classList.add('text-green-400');
      } else if (status === 'Alerta') {
        statusEl.classList.add('text-yellow-400');
      } else {
        statusEl.classList.add('text-white');
      }
    }

    analyzeBtn.addEventListener('click', function () {
      const prompt = textarea.value;

      if (prompt.trim() === '') {
        resultsSection.classList.remove('hidden');
        showError('El prompt no puede estar vacío. Escribe o pega texto antes de analizar.');
        resultTokens.textContent = '—';
        resultLatency.textContent = '—';
        resultStatus.textContent = '—';
        applyStatusColor(resultStatus, null);
        return;
      }

      hideError();
      setLoading(true);
      resultsSection.classList.remove('hidden');
      resultTokens.textContent = '…';
      resultLatency.textContent = '…';
      resultStatus.textContent = '…';
      applyStatusColor(resultStatus, null);

      fetch('http://localhost:8000/api/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: prompt })
      })
        .then(function (response) {
          if (!response.ok) {
            return response.json().then(function (errData) {
              throw new Error(errData.detail || 'Error ' + response.status + ' del servidor.');
            });
          }
          return response.json();
        })
        .then(function (data) {
          resultTokens.textContent = data.estimated_tokens;
          resultLatency.textContent = data.simulated_latency_ms + ' ms';
          resultStatus.textContent = data.status;
          applyStatusColor(resultStatus, data.status);
        })
        .catch(function (err) {
          resultTokens.textContent = '—';
          resultLatency.textContent = '—';
          resultStatus.textContent = '—';
          applyStatusColor(resultStatus, null);
          showError('No se pudo conectar con el backend. Asegúrate de que main.py esté corriendo en http://localhost:8000. Detalle: ' + err.message);
        })
        .finally(function () {
          setLoading(false);
        });
    });
  </script>

</body>
</html>
