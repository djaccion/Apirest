<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Validador de Prompts y Tokens — PROYEC-20</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen py-10 px-4">
  <main class="max-w-2xl mx-auto">
    <header class="mb-8">
      <h1 class="text-3xl font-bold text-gray-800">Validador de Prompts y Tokens</h1>
      <p class="text-gray-500 mt-2">Estima tokens, palabras, latencia y costo de un prompt antes de integrarlo al orquestador principal.</p>
    </header>

    <section id="input-section" class="bg-white rounded-2xl shadow p-6 mb-6">
      <label for="prompt-input" class="block text-sm font-semibold text-gray-700 mb-2">Texto del Prompt</label>
      <textarea
        id="prompt-input"
        rows="10"
        placeholder="Escribe o pega aquí el prompt que deseas analizar..."
        required
        class="w-full border border-gray-300 rounded-lg p-3 text-sm text-gray-800 focus:outline-none focus:ring-2 focus:ring-indigo-400 resize-y"
      ></textarea>
      <div class="mt-4 flex items-center gap-4">
        <button
          id="analyze-btn"
          type="button"
          onclick="analyzePrompt()"
          class="bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold px-6 py-2 rounded-lg transition-colors"
        >
          Analizar Prompt
        </button>
        <p id="loading-indicator" class="hidden text-sm text-indigo-500 font-medium animate-pulse">Analizando...</p>
      </div>
    </section>

    <p id="error-message" class="hidden text-red-600 bg-red-50 border border-red-200 rounded-lg px-4 py-3 text-sm mb-6"></p>

    <section id="results-section" class="hidden bg-white rounded-2xl shadow p-6">
      <h2 class="text-lg font-bold text-gray-700 mb-4">Resultados del Análisis</h2>
      <div class="grid grid-cols-2 gap-4">
        <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-4">
          <p class="text-xs font-semibold text-indigo-400 uppercase tracking-wide mb-1">Tokens Estimados</p>
          <span id="result-tokens" class="text-2xl font-bold text-indigo-700">—</span>
        </div>
        <div class="bg-emerald-50 border border-emerald-100 rounded-xl p-4">
          <p class="text-xs font-semibold text-emerald-400 uppercase tracking-wide mb-1">Palabras Contadas</p>
          <span id="result-words" class="text-2xl font-bold text-emerald-700">—</span>
        </div>
        <div class="bg-amber-50 border border-amber-100 rounded-xl p-4">
          <p class="text-xs font-semibold text-amber-400 uppercase tracking-wide mb-1">Latencia Simulada</p>
          <span id="result-latency" class="text-2xl font-bold text-amber-700">—</span>
        </div>
        <div class="bg-rose-50 border border-rose-100 rounded-xl p-4">
          <p class="text-xs font-semibold text-rose-400 uppercase tracking-wide mb-1">Costo Estimado</p>
          <span id="result-cost" class="text-2xl font-bold text-rose-700">—</span>
        </div>
      </div>
    </section>
  </main>

  <script>
    const API_URL = 'http://localhost:8000/api/analyze';

    function setLoadingState(isLoading) {
      const indicator = document.getElementById('loading-indicator');
      const btn = document.getElementById('analyze-btn');
      if (isLoading) {
        indicator.classList.remove('hidden');
        btn.disabled = true;
      } else {
        indicator.classList.add('hidden');
        btn.disabled = false;
      }
    }

    function displayResults(data) {
      document.getElementById('result-tokens').textContent = data.tokens;
      document.getElementById('result-words').textContent = data.words;
      document.getElementById('result-latency').textContent = data.latency;
      document.getElementById('result-cost').textContent = data.cost;
      document.getElementById('results-section').classList.remove('hidden');
      document.getElementById('error-message').classList.add('hidden');
    }

    function displayError(message) {
      document.getElementById('error-message').textContent = message;
      document.getElementById('error-message').classList.remove('hidden');
      document.getElementById('results-section').classList.add('hidden');
    }

    async function analyzePrompt() {
      const promptInput = document.getElementById('prompt-input');
      const text = promptInput.value.trim();

      if (!text) {
        displayError('El campo de prompt no puede estar vacío.');
        return;
      }

      setLoadingState(true);
      document.getElementById('error-message').classList.add('hidden');
      document.getElementById('results-section').classList.add('hidden');

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => null);
          const errorMsg = errorData && errorData.detail
            ? errorData.detail
            : 'Error del servidor: ' + response.status;
          displayError(errorMsg);
          return;
        }

        const data = await response.json();
        displayResults(data);
      } catch (err) {
        displayError('No se pudo conectar con el backend. Asegúrate de que main.py esté corriendo en http://localhost:8000.');
      } finally {
        setLoadingState(false);
      }
    }
  </script>
</body>
</html>
