<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Validador de Prompts</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex items-center justify-center">
  <div class="bg-white shadow-md rounded-xl p-8 w-full max-w-xl mx-4">

    <h1 class="text-2xl font-bold text-gray-800 mb-1">Validador de Prompts y Tokens</h1>
    <p class="text-sm text-gray-500 mb-6">Analiza tu prompt, estima los tokens consumidos y evalúa su estado de optimización.</p>

    <div class="mb-2">
      <label for="promptInput" class="block text-sm font-medium text-gray-700 mb-1">Escribe tu prompt</label>
      <textarea
        id="promptInput"
        rows="5"
        placeholder="Escribe aquí tu prompt para analizarlo..."
        class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all duration-200 resize-y"
      ></textarea>
    </div>

    <p id="errorMsg" class="text-red-500 text-sm mb-3 hidden">El prompt no puede estar vacío.</p>

    <button
      id="analyzeBtn"
      class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold py-3 rounded-lg transition-colors duration-200 mb-6"
    >
      Analizar Prompt
    </button>

    <div id="resultsPanel" class="hidden">
      <h2 class="text-base font-semibold text-gray-800 mb-3">Resultados del Análisis</h2>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">

        <div class="bg-gray-50 border border-gray-200 rounded-lg p-4">
          <p class="text-xs text-gray-500 uppercase font-semibold mb-1">Tokens Estimados</p>
          <p id="tokenCount" class="text-2xl font-bold text-blue-600">—</p>
        </div>

        <div class="bg-gray-50 border border-gray-200 rounded-lg p-4">
          <p class="text-xs text-gray-500 uppercase font-semibold mb-1">Latencia Simulada</p>
          <p id="latencyValue" class="text-2xl font-bold text-green-600">—</p>
        </div>

        <div class="bg-gray-50 border border-gray-200 rounded-lg p-4">
          <p class="text-xs text-gray-500 uppercase font-semibold mb-1">Estado del Prompt</p>
          <p id="promptStatus" class="text-2xl font-bold text-green-600">—</p>
        </div>

      </div>
    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const promptInput = document.getElementById('promptInput');
      const analyzeBtn = document.getElementById('analyzeBtn');
      const errorMsg = document.getElementById('errorMsg');
      const resultsPanel = document.getElementById('resultsPanel');
      const tokenCount = document.getElementById('tokenCount');
      const latencyValue = document.getElementById('latencyValue');
      const promptStatus = document.getElementById('promptStatus');

      analyzeBtn.addEventListener('click', async function () {
        // Paso 1 - Limpiar estado previo
        promptInput.classList.remove('border-red-500', 'ring-2', 'ring-red-300');
        promptInput.classList.add('border-gray-300');
        errorMsg.classList.add('hidden');
        resultsPanel.classList.add('hidden');

        // Paso 2 - Validación cliente
        const promptValue = promptInput.value.trim();

        if (!promptValue) {
          promptInput.classList.remove('border-gray-300');
          promptInput.classList.add('border-red-500', 'ring-2', 'ring-red-300');
          errorMsg.classList.remove('hidden');
          return;
        }

        // Paso 3 - Estado loading
        analyzeBtn.disabled = true;
        analyzeBtn.textContent = 'Analizando...';

        try {
          const response = await fetch('http://localhost:8000/api/analyze', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ prompt: promptValue })
          });

          if (!response.ok) {
            throw new Error('Error en la respuesta del servidor: ' + response.status);
          }

          const data = await response.json();

          // Paso 4 - Renderizar resultados
          tokenCount.textContent = data.tokens;
          latencyValue.textContent = data.latency_ms + ' ms';

          promptStatus.classList.remove('text-green-600', 'text-yellow-600');
          if (data.status === 'Óptimo') {
            promptStatus.textContent = 'Óptimo';
            promptStatus.classList.add('text-green-600');
          } else {
            promptStatus.textContent = 'Alerta';
            promptStatus.classList.add('text-yellow-600');
          }

          resultsPanel.classList.remove('hidden');

        } catch (error) {
          alert('No se pudo conectar con el servidor. Asegúrate de que el backend está corriendo en http://localhost:8000\n\nDetalle: ' + error.message);
        } finally {
          // Paso 5 - Restaurar botón
          analyzeBtn.disabled = false;
          analyzeBtn.textContent = 'Analizar Prompt';
        }
      });
    });
  </script>
</body>
</html>
