<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <meta name="description" content="TSOFT — Saludos internacionales y coloquiales desde cada oficina alrededor del mundo.">
  <meta name="author" content="TSOFT">
  <meta name="robots" content="index, follow">
  <title>Hola TSOFT — Saludos desde el Mundo</title>

<body>

  <header role="banner">

        <button id="btn-lang-es" data-lang="es" aria-pressed="true">ES</button>
        <button id="btn-lang-en" data-lang="en" aria-pressed="false">EN</button>
      </div>

    <div class="header-brand">
      <h1 id="main-title">Hola, Mundo TSOFT</h1>
      <p id="main-subtitle">Saludos coloquiales desde cada oficina</p>

  <main role="main" id="main-content">
    <section id="greetings-section" aria-label="Saludos por país">
      <div id="greetings-grid" class="greetings-grid"></div>
      <div id="loading-state" class="loading-state" aria-live="polite">Cargando saludos...</div>
    </section>
  </main>

  <footer role="contentinfo">
    <p class="footer-copy">© 2024 TSOFT. Todos los derechos reservados.</p>
