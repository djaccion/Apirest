<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Arcade — PROYEC-21</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="game-wrapper">

    <div id="screen-menu" class="screen">
      <h1 class="arcade-text blink">SPACE ARCADE</h1>
      <p class="arcade-text">USA LAS FLECHAS PARA MOVERTE</p>
      <button id="btn-start" class="arcade-text">INICIAR PARTIDA</button>
    </div>

    <div id="screen-game" class="screen hidden">
      <canvas id="canvas-game"></canvas>
    </div>

    <div id="screen-gameover" class="screen hidden">
      <h2 class="arcade-text">GAME OVER</h2>
      <p class="arcade-text">PUNTUACIÓN: <span id="text-final-score">0</span></p>
      <p class="arcade-text">NIVEL ALCANZADO: <span id="text-level-reached">1</span></p>
      <button id="btn-restart" class="arcade-text">REINICIAR</button>
    </div>

    <div id="screen-levelup" class="screen hidden">
      <h2 class="arcade-text blink">¡NIVEL SUPERADO!</h2>
      <p id="text-level-reached-up" class="arcade-text">NIVEL</p>
    </div>

    <div id="hud" class="hud-panel hidden">
      <div class="hud-item arcade-text">
        SCORE: <span id="hud-score">0</span>
      </div>
      <div class="hud-item arcade-text">
        NIVEL: <span id="hud-level">1</span>
      </div>
      <div class="hud-item arcade-text">
        VIDAS: <span id="hud-lives">3</span>
      </div>
      <div class="hud-item">
        <span id="hud-powerup-speed"    class="powerup-indicator arcade-text hidden">VEL</span>
        <span id="hud-powerup-shield"   class="powerup-indicator arcade-text hidden">ESC</span>
        <span id="hud-powerup-maneuver" class="powerup-indicator arcade-text hidden">MAN</span>
      </div>
      <button id="btn-pause" class="arcade-text">PAUSA</button>
    </div>

    <div class="scanlines" aria-hidden="true"></div>

  </div>

  <script src="js/main.js"></script>
</body>
</html>
