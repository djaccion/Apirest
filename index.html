<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STAR FIGHTER — Arcade 80s</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="game-wrapper">
    <div class="star-field" aria-hidden="true"></div>

    <div id="screen-menu" class="screen">
      <h1 class="game-title">STAR FIGHTER</h1>
      <p class="game-subtitle">ARCADE 80s</p>

      <div class="difficulty-selector">
        <p class="selector-label">DIFICULTAD</p>
        <div class="btn-group">
          <button id="btn-difficulty-easy"   class="btn-arcade is-active">FÁCIL</button>
          <button id="btn-difficulty-medium" class="btn-arcade">NORMAL</button>
          <button id="btn-difficulty-hard"   class="btn-arcade">DIFÍCIL</button>
        </div>
      </div>

      <button id="btn-start" class="btn-arcade btn-arcade--primary">INICIAR JUEGO</button>

      <div class="controls-hint">
        <p>← → GIRAR &nbsp;|&nbsp; ↑ ↓ ACELERAR &nbsp;|&nbsp; ESPACIO DISPARAR</p>
        <p>ESC / P PAUSA</p>
      </div>
    </div>

    <div id="screen-game" class="screen" hidden>
      <div class="hud-bar">
        <div class="hud-stat">
          <span class="hud-stat__label">SCORE</span>
          <span id="hud-score" class="hud-stat__value">000000</span>
        </div>
        <div class="hud-stat">
          <span class="hud-stat__label">NIVEL</span>
          <span id="hud-level" class="hud-stat__value">01</span>
        </div>
        <div class="hud-stat">
          <span class="hud-stat__label">VIDAS</span>
          <span id="hud-lives" class="hud-stat__value">3</span>
        </div>
        <div class="hud-stat">
          <span id="hud-powerup-indicator" class="hud-stat__value" hidden>— —</span>
        </div>
      </div>

      <canvas id="game-canvas"></canvas>
    </div>

    <div id="screen-pause" class="screen" hidden>
      <div class="overlay-panel">
        <h2 class="overlay-panel__title">— PAUSA —</h2>
        <button id="btn-resume" class="btn-arcade btn-arcade--primary">CONTINUAR</button>
      </div>
    </div>

    <div id="screen-gameover" class="screen" hidden>
      <div class="overlay-panel">
        <h2 class="overlay-panel__title">GAME OVER</h2>

        <div class="result-stats">
          <div class="hud-stat">
            <span class="hud-stat__label">PUNTUACIÓN FINAL</span>
            <span id="gameover-score-value" class="hud-stat__value">000000</span>
          </div>
          <div class="hud-stat">
            <span class="hud-stat__label">NIVEL ALCANZADO</span>
            <span id="gameover-level-value" class="hud-stat__value">01</span>
          </div>
        </div>

        <button id="btn-restart" class="btn-arcade btn-arcade--danger">REINICIAR</button>
      </div>
    </div>

    <div id="screen-levelup" class="screen" hidden>
      <div class="overlay-panel">
        <h2 class="overlay-panel__title">¡NIVEL SUPERADO!</h2>
        <p class="overlay-panel__subtitle">
          NIVEL <span id="levelup-level-value">02</span>
        </p>
      </div>
    </div>

    <div class="scanline" aria-hidden="true"></div>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
