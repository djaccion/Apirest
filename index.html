<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Saludos internacionales de las oficinas Tsoft">
    <title>Saludos Internacionales — Tsoft</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header>
      <span class="logo-placeholder">[TSOFT]</span>
      <h1>Saludos Internacionales — Tsoft</h1>
      <p>Así saludamos en cada una de nuestras oficinas</p>
    </header>
    <main>
      <div id="greetings-grid" role="list" aria-label="Saludos por país"></div>
    </main>
    <footer class="site-footer">
      <p>© Tsoft — Todos los derechos reservados</p>
    </footer>
    <script>
      const greetings = [
        { country: "Argentina", greeting: "¡Buenas!",             context: "Saludo informal rioplatense, válido a cualquier hora" },
        { country: "Chile",     greeting: "¡Buenas!",             context: "Saludo coloquial chileno, abreviación de 'buenas tardes/noches'" },
        { country: "Uruguay",   greeting: "¡Hola, ¿cómo andás?", context: "Saludo cotidiano con tuteo rioplatense" },
        { country: "Colombia",  greeting: "¡Quiubo!",             context: "Contracción de '¿Qué hubo?', saludo informal bogotano" },
        { country: "Perú",      greeting: "¡Habla, causa!",       context: "Saludo entre amigos, 'causa' significa 'pata' o amigo cercano" },
        { country: "México",    greeting: "¡Qué onda!",           context: "Saludo informal juvenil de uso extendido en todo el país" },
        { country: "Brasil",    greeting: "E aí!",                context: "Saludo informal brasileño equivalente a '¿Qué hay?'" },
        { country: "España",    greeting: "¡Buenas!",             context: "Saludo coloquial peninsular, válido a cualquier hora del día" },
        { country: "EE.UU.",    greeting: "Hey!",                 context: "Saludo informal anglosajón de uso universal entre colegas" }
      ];

      function buildCard(item) {
        const article = document.createElement("article");
        article.setAttribute("role", "listitem");
        article.className = "greeting-card";

        const countryEl = document.createElement("h2");
        countryEl.className = "greeting-card__country";
        countryEl.textContent = item.country;

        const greetingEl = document.createElement("p");
        greetingEl.className = "greeting-card__greeting";
        greetingEl.textContent = item.greeting;

        const contextEl = document.createElement("p");
        contextEl.className = "greeting-card__context";
        contextEl.textContent = item.context;

        article.appendChild(countryEl);
        article.appendChild(greetingEl);
        article.appendChild(contextEl);

        return article;
      }

      function renderGreetings(data, container) {
        const fragment = document.createDocumentFragment();
        for (let i = 0; i < data.length; i++) {
          fragment.appendChild(buildCard(data[i]));
        }
        container.appendChild(fragment);
      }

      const grid = document.getElementById("greetings-grid");
      renderGreetings(greetings, grid);
    </script>
  </body>
</html>
