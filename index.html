<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Saludos internacionales de las oficinas globales de Tsoft">
  <title>Saludos Internacionales — Tsoft</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header id="site-header">
    <div id="logo-container">
      <svg width="120" height="40" viewBox="0 0 120 40" aria-label="Tsoft logo">
        <rect width="120" height="40" rx="6" fill="#0057B8"></rect>
        <text x="60" y="27" text-anchor="middle" fill="#FFFFFF" font-size="18" font-family="sans-serif" font-weight="bold">Tsoft</text>
      </svg>
    </div>
    <div id="header-text">
      <h1>Saludos Internacionales</h1>
      <p id="header-subtitle">Conoce cómo saludan nuestros equipos alrededor del mundo</p>
    </div>
  </header>

  <main id="main-content">
    <section id="search-section" aria-label="Filtro de búsqueda por país">
      <label for="search-input">Buscar por país o saludo:</label>
      <input
        type="search"
        id="search-input"
        name="search"
        placeholder="Ej: México, Hola, Ciao..."
        autocomplete="off"
        maxlength="50"
        aria-controls="greetings-grid"
      >
    </section>

    <section id="greetings-section" aria-label="Listado de saludos por país">
      <div id="greetings-grid" role="list" aria-live="polite" aria-label="Tarjetas de saludos">
        <!-- main.js inyecta las tarjetas aquí en tiempo de ejecución -->
      </div>
      <p id="no-results-message" hidden aria-live="assertive">
        No se encontraron resultados para tu búsqueda.
      </p>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
