<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de Prompts</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-[600px] bg-slate-800 rounded-2xl shadow-2xl p-8">

        <!-- ENCABEZADO -->
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-slate-100 mb-2">Validador de Prompts y Tokens</h1>
            <p class="text-sm text-slate-400">Analiza tu prompt para estimar el número de tokens, la latencia de procesamiento y el estado de optimización antes de enviarlo a un modelo de lenguaje.</p>
        </div>

        <!-- FORMULARIO -->
        <form id="prompt-form" novalidate>
            <div class="mb-4">
                <label for="prompt-input" class="block text-sm font-medium text-slate-300 mb-2">Tu Prompt</label>
                <textarea
                    id="prompt-input"
                    rows="5"
                    class="w-full bg-slate-700 border border-slate-600 text-slate-100 rounded-lg p-3 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all duration-200 resize-y resize-x-none"
                    placeholder="Escribe o pega tu prompt aquí..."
                ></textarea>
            </div>

            <button
                id="submit-btn"
                type="submit"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg cursor-pointer transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
            >
                Analizar Prompt
            </button>
        </form>

        <!-- LOADING INDICATOR -->
        <div id="loading-indicator" class="hidden mt-6 flex items-center justify-center gap-3">
            <svg class="animate-spin h-6 w-6 text-indigo-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            <span class="text-slate-300 text-sm">Analizando tu prompt...</span>
        </div>

        <!-- RESULTADOS -->
        <div id="results-container" class="hidden mt-8">
            <h2 class="text-base font-semibold text-slate-200 mb-4">Resultados del Análisis</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

                <!-- Tarjeta Tokens -->
                <div class="bg-slate-700 rounded-xl p-4">
                    <p class="text-xs text-slate-400 mb-1 uppercase tracking-wide">Tokens Estimados</p>
                    <p id="result-tokens" class="text-2xl font-bold text-white">—</p>
                </div>

                <!-- Tarjeta Latencia -->
                <div class="bg-slate-700 rounded-xl p-4">
                    <p class="text-xs text-slate-400 mb-1 uppercase tracking-wide">Latencia</p>
                    <p id="result-latency" class="text-2xl font-bold text-white">—</p>
                </div>

                <!-- Tarjeta Estado -->
                <div id="status-card" class="bg-slate-700 rounded-xl p-4 border-2 border-slate-600 transition-colors duration-300">
                    <p class="text-xs text-slate-400 mb-1 uppercase tracking-wide">Estado</p>
                    <p id="result-status" class="text-2xl font-bold">—</p>
                </div>

            </div>
        </div>

        <!-- ERROR -->
        <div id="error-container" class="hidden mt-6 bg-red-900/40 border-l-4 border-red-500 rounded-lg p-4 flex items-start gap-3">
            <svg class="h-5 w-5 text-red-400 flex-shrink-0 mt-0.5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
            </svg>
            <p id="error-message" class="text-red-300 text-sm"></p>
        </div>

    </div>

    <script>
        // --- REFERENCIAS DOM ---
        const form = document.getElementById('prompt-form');
        const promptInput = document.getElementById('prompt-input');
        const submitBtn = document.getElementById('submit-btn');
        const loadingIndicator = document.getElementById('loading-indicator');
        const resultsContainer = document.getElementById('results-container');
        const errorContainer = document.getElementById('error-container');
        const errorMessage = document.getElementById('error-message');
        const resultTokens = document.getElementById('result-tokens');
        const resultLatency = document.getElementById('result-latency');
        const resultStatus = document.getElementById('result-status');
        const statusCard = document.getElementById('status-card');

        // --- FUNCIÓN resetUI ---
        function resetUI() {
            resultsContainer.classList.add('hidden');
            errorContainer.classList.add('hidden');
            loadingIndicator.classList.add('hidden');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Analizar Prompt';
            promptInput.classList.remove('border-red-500');
        }

        // --- FUNCIÓN showLoading ---
        function showLoading() {
            resultsContainer.classList.add('hidden');
            errorContainer.classList.add('hidden');
            loadingIndicator.classList.remove('hidden');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Analizando...';
        }

        // --- FUNCIÓN showResults ---
        function showResults(data) {
            loadingIndicator.classList.add('hidden');

            resultTokens.textContent = data.tokens;
            resultLatency.textContent = data.latency_ms + ' ms';

            if (data.tokens <= 1000) {
                resultStatus.textContent = 'Óptimo';
                resultStatus.className = 'text-2xl font-bold text-green-400';
                statusCard.classList.remove('border-yellow-500');
                statusCard.classList.add('border-green-500');
            } else {
                resultStatus.textContent = 'Alerta';
                resultStatus.className = 'text-2xl font-bold text-yellow-400';
                statusCard.classList.remove('border-green-500');
                statusCard.classList.add('border-yellow-500');
            }

            resultsContainer.classList.remove('hidden');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Analizar Prompt';
        }

        // --- FUNCIÓN showError ---
        function showError(message) {
            loadingIndicator.classList.add('hidden');
            errorMessage.textContent = message;
            errorContainer.classList.remove('hidden');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Analizar Prompt';
        }

        // --- MANEJADOR DE ENVÍO ---
        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            const promptValue = promptInput.value.trim();

            // Validación client-side
            if (!promptValue) {
                promptInput.classList.add('border-red-500');
                return;
            }

            promptInput.classList.remove('border-red-500');
            showLoading();

            try {
                const response = await fetch('http://localhost:8000/api/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ prompt: promptValue })
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.detail || `Error del servidor: ${response.status}`);
                }

                const data = await response.json();
                showResults(data);

            } catch (err) {
                if (err instanceof TypeError && err.message.includes('fetch')) {
                    showError('No se pudo conectar con el servidor. Asegúrate de que el backend esté corriendo en http://localhost:8000');
                } else {
                    showError(err.message || 'Ocurrió un error inesperado al analizar el prompt.');
                }
            }
        });

        // Limpiar error de borde al escribir
        promptInput.addEventListener('input', function () {
            if (promptInput.value.trim()) {
                promptInput.classList.remove('border-red-500');
            }
        });
    </script>

</body>
</html>
