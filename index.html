<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://placehold.co; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
  <!-- DEPLOY NOTE: Configurar HSTS, X-Frame-Options y X-Content-Type-Options en el servidor al desplegar. Estas cabeceras no aplican en file:/// -->
  <meta name="description" content="Saludos internacionales de las oficinas Tsoft">
  <title>Saludos Internacionales — Tsoft</title>
  <style>
    :root {
      --color-primary: #1A3C5E;
      --color-primary-light: #2A5C8E;
      --color-accent: #E8A020;
      --color-bg: #F4F6F9;
      --color-surface: #FFFFFF;
      --color-text-primary: #1A1A2E;
      --color-text-secondary: #4A5568;
      --color-text-on-dark: #FFFFFF;
      --color-border: #D1D9E6;
      --font-stack: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --radius-card: 12px;
      --shadow-card: 0 2px 8px rgba(0,0,0,0.08);
      --transition-card: transform 0.2s ease, box-shadow 0.2s ease;
      --grid-min-col: 280px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-stack); background: var(--color-bg); color: var(--color-text-primary); line-height: 1.5; }
    img { display: block; max-width: 100%; }

    header.site-header {
      background: var(--color-primary);
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    header.site-header .site-logo { height: 48px; width: auto; }
    header.site-header .site-title {
      color: var(--color-text-on-dark);
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    main.site-main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem 3rem;
    }

    .section-heading {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--color-primary);
      margin-bottom: 0.375rem;
    }
    .section-subheading {
      font-size: 0.95rem;
      color: var(--color-text-secondary);
      margin-bottom: 2rem;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(var(--grid-min-col), 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      transition: var(--transition-card);
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .card-flag {
      font-size: 2rem;
      line-height: 1;
      flex-shrink: 0;
    }
    .card-country {
      font-size: 1rem;
      font-weight: 700;
      color: var(--color-primary);
    }
    .card-office {
      font-size: 0.8rem;
      color: var(--color-text-secondary);
      margin-top: 0.1rem;
    }

    .card-divider {
      border: none;
      border-top: 1px solid var(--color-border);
    }

    .card-greeting-native {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--color-text-primary);
    }
    .card-greeting-es {
      font-size: 0.875rem;
      color: var(--color-text-secondary);
      font-style: italic;
    }

    .card-footer {
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .card-lang-badge {
      display: inline-block;
      background: var(--color-primary-light);
      color: var(--color-text-on-dark);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      text-transform: uppercase;
    }
    .card-timezone {
      font-size: 0.75rem;
      color: var(--color-text-secondary);
      margin-left: auto;
    }

    footer.site-footer {
      background: var(--color-primary);
      color: var(--color-text-on-dark);
      text-align: center;
      padding: 1.25rem 2rem;
      font-size: 0.8rem;
      opacity: 0.9;
    }
    footer.site-footer a {
      color: var(--color-accent);
      text-decoration: none;
    }
    footer.site-footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      header.site-header { padding: 1rem 1.25rem; gap: 1rem; }
      header.site-header .site-title { font-size: 1rem; }
      main.site-main { padding: 1.5rem 1rem 2.5rem; }
      .section-heading { font-size: 1.25rem; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <img
      class="site-logo"
      src="https://placehold.co/160x48?text=Tsoft"
      alt="Logotipo de Tsoft"
      width="160"
      height="48"
    >
    <span class="site-title">Saludos Internacionales</span>
  </header>

  <main class="site-main">
    <h1 class="section-heading">Oficinas Tsoft en el mundo</h1>
    <p class="section-subheading">Un saludo desde cada una de nuestras sedes globales.</p>
    <div class="cards-grid" id="cards-container"></div>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="footer-year"></span> Tsoft. Todos los derechos reservados.</p>
  </footer>

  <script>
    var offices = [
      {
        country: "España",
        office: "Sede Central — Madrid",
        flag: "🇪🇸",
        greetingNative: "¡Hola!",
        greetingEs: "¡Hola!",
        lang: "ES",
        timezone: "UTC+1 / UTC+2"
      },
      {
        country: "Estados Unidos",
        office: "Oficina — Nueva York",
        flag: "🇺🇸",
        greetingNative: "Hello!",
        greetingEs: "¡Hola!",
        lang: "EN",
        timezone: "UTC−5 / UTC−4"
      },
      {
        country: "Francia",
        office: "Oficina — París",
        flag: "🇫🇷",
        greetingNative: "Bonjour !",
        greetingEs: "¡Buenos días!",
        lang: "FR",
        timezone: "UTC+1 / UTC+2"
      },
      {
        country: "Alemania",
        office: "Oficina — Berlín",
        flag: "🇩🇪",
        greetingNative: "Hallo!",
        greetingEs: "¡Hola!",
        lang: "DE",
        timezone: "UTC+1 / UTC+2"
      },
      {
        country: "Japón",
        office: "Oficina — Tokio",
        flag: "🇯🇵",
        greetingNative: "こんにちは！",
        greetingEs: "¡Buenas tardes!",
        lang: "JA",
        timezone: "UTC+9"
      },
      {
        country: "Brasil",
        office: "Oficina — São Paulo",
        flag: "🇧🇷",
        greetingNative: "Olá!",
        greetingEs: "¡Hola!",
        lang: "PT",
        timezone: "UTC−3"
      },
      {
        country: "México",
        office: "Oficina — Ciudad de México",
        flag: "🇲🇽",
        greetingNative: "¡Hola!",
        greetingEs: "¡Hola!",
        lang: "ES",
        timezone: "UTC−6 / UTC−5"
      },
      {
        country: "India",
        office: "Oficina — Bangalore",
        flag: "🇮🇳",
        greetingNative: "नमस्ते!",
        greetingEs: "¡Namaste!",
        lang: "HI",
        timezone: "UTC+5:30"
      },
      {
        country: "Australia",
        office: "Oficina — Sídney",
        flag: "🇦🇺",
        greetingNative: "G'day!",
        greetingEs: "¡Buen día!",
        lang: "EN",
        timezone: "UTC+10 / UTC+11"
      },
      {
        country: "Corea del Sur",
        office: "Oficina — Seúl",
        flag: "🇰🇷",
        greetingNative: "안녕하세요!",
        greetingEs: "¡Bienvenido!",
        lang: "KO",
        timezone: "UTC+9"
      },
      {
        country: "Países Bajos",
        office: "Oficina — Ámsterdam",
        flag: "🇳🇱",
        greetingNative: "Hallo!",
        greetingEs: "¡Hola!",
        lang: "NL",
        timezone: "UTC+1 / UTC+2"
      },
      {
        country: "Emiratos Árabes",
        office: "Oficina — Dubái",
        flag: "🇦🇪",
        greetingNative: "مرحبا!",
        greetingEs: "¡Bienvenido!",
        lang: "AR",
        timezone: "UTC+4"
      }
    ];

    function buildCard(office) {
      var card = document.createElement('article');
      card.className = 'card';

      card.innerHTML =
        '<div class="card-header">' +
          '<span class="card-flag" aria-hidden="true">' + office.flag + '</span>' +
          '<div>' +
            '<div class="card-country">' + office.country + '</div>' +
            '<div class="card-office">' + office.office + '</div>' +
          '</div>' +
        '</div>' +
        '<hr class="card-divider">' +
        '<p class="card-greeting-native">' + office.greetingNative + '</p>' +
        '<p class="card-greeting-es">' + office.greetingEs + '</p>' +
        '<div class="card-footer">' +
          '<span class="card-lang-badge">' + office.lang + '</span>' +
          '<span class="card-timezone">' + office.timezone + '</span>' +
        '</div>';

      return card;
    }

    function renderCards() {
      var container = document.getElementById('cards-container');
      for (var i = 0; i < offices.length; i++) {
        container.appendChild(buildCard(offices[i]));
      }
    }

    function setFooterYear() {
      var yearEl = document.getElementById('footer-year');
      if (yearEl) {
        yearEl.textContent = new Date().getFullYear();
      }
    }

    renderCards();
    setFooterYear();
  </script>

</body>
</html>
