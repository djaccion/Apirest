<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self'; script-src 'self';">
  <meta name="description" content="Saludos desde las oficinas TSOFT alrededor del mundo.">
  <title>Hola TSOFT</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header id="site-header">
    <div class="container">
      <h1 id="main-title">Saludos desde TSOFT</h1>
    </div>
  </header>

  <main>
    <div class="container">

      <!-- SELECTOR DE PAÍS -->
      <div id="country-selector">
        <button id="dropdown-trigger" class="tsoft-btn" aria-haspopup="listbox" aria-expanded="false">
          <span id="greeting-flag">🇦🇷</span>
          <span id="greeting-country">Argentina</span>
          <span class="trigger-arrow" aria-hidden="true">▾</span>
        </button>

        <ul id="dropdown-panel" role="listbox" aria-label="Seleccionar país">
          <li class="dropdown-option"
              role="option"
              data-country-id="ar"
              data-lang="es-AR"
              data-greeting="¡Hola desde Argentina!">
            <span class="flag-emoji" aria-hidden="true">🇦🇷</span>
            <span class="country-name">Argentina</span>
          </li>
          <li class="dropdown-option"
              role="option"
              data-country-id="co"
              data-lang="es-CO"
              data-greeting="¡Hola desde Colombia!">
            <span class="flag-emoji" aria-hidden="true">🇨🇴</span>
            <span class="country-name">Colombia</span>
          </li>
          <li class="dropdown-option"
              role="option"
              data-country-id="pe"
              data-lang="es-PE"
              data-greeting="¡Hola desde Perú!">
            <span class="flag-emoji" aria-hidden="true">🇵🇪</span>
            <span class="country-name">Perú</span>
          </li>
          <li class="dropdown-option"
              role="option"
              data-country-id="mx"
              data-lang="es-MX"
              data-greeting="¡Hola desde México!">
            <span class="flag-emoji" aria-hidden="true">🇲🇽</span>
            <span class="country-name">México</span>
          </li>
          <li class="dropdown-option"
              role="option"
              data-country-id="us"
              data-lang="en-US"
              data-greeting="Hello from the United States!">
            <span class="flag-emoji" aria-hidden="true">🇺🇸</span>
            <span class="country-name">United States</span>
          </li>
          <li class="dropdown-option"
              role="option"
              data-country-id="es"
              data-lang="es-ES"
              data-greeting="¡Hola desde España!">
            <span class="flag-emoji" aria-hidden="true">🇪🇸</span>
            <span class="country-name">España</span>
          </li>
        </ul>
      </div>
      <!-- FIN SELECTOR DE PAÍS -->

      <!-- TARJETA DE SALUDO -->
      <div class="card-greeting">
        <div id="greeting-display" class="is-active">
          <p id="greeting-text">¡Hola desde Argentina!</p>
        </div>
      </div>
      <!-- FIN TARJETA DE SALUDO -->

    </div>
  </main>

  <script defer src="js/main.js"></script>
</body>
</html>
