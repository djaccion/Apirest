<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPACE ARCADE — PROYEC-21</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div id="screen-start">
    <h1>SPACE ARCADE</h1>
    <p>PRESIONA ENTER O TOCA INICIAR</p>
    <div id="hiscore-display">HI-SCORE: 0</div>
    <button id="btn-start">INICIAR</button>
  </div>

  <div id="screen-game" class="hidden">
    <canvas id="game-canvas"></canvas>
    <div id="hud">
      <span id="hud-score">SCORE: 0</span>
      <span id="hud-lives">VIDAS: 3</span>
      <span id="hud-level">NIVEL: 1</span>
    </div>
    <div id="player-ship"></div>
    <button id="btn-pause">⏸ PAUSA</button>
  </div>

  <div id="screen-pause" class="hidden">
    <h2>PAUSA</h2>
    <button id="btn-resume">CONTINUAR</button>
  </div>

  <div id="screen-gameover" class="hidden">
    <h2>GAME OVER</h2>
    <p id="final-score">SCORE: 0</p>
    <p id="final-hiscore">HI-SCORE: 0</p>
    <button id="btn-restart">REINTENTAR</button>
  </div>

  <div id="overlay-level-up" class="hidden">
    <p>¡NIVEL SUPERADO!</p>
    <span id="overlay-level-number"></span>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
