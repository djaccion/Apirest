<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saludos Internacionales — Tsoft</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <div class="header-inner">
        <span class="logo-text">Tsoft</span>
        <nav aria-label="Navegación principal">
          <a href="#greetings-section">Saludos</a>
        </nav>
      </div>
    </header>

    <main>
      <section id="greetings-section" aria-labelledby="section-title">
        <h1 id="section-title">Saludos desde nuestras oficinas</h1>
        <p class="section-subtitle">
          Así nos saludan nuestros equipos alrededor del mundo.
        </p>
        <div id="greetings-grid" role="list">
        </div>
      </section>
    </main>

    <footer>
      <div class="footer-inner">
        <p>&copy; <span id="current-year"></span> Tsoft. Todos los derechos reservados.</p>
      </div>
    </footer>

    <script>
      var greetingsData = [
        {
          country: "Argentina",
          flag: "🇦🇷",
          greeting: "¡Buenas!",
          language: "Español rioplatense",
          city: "Buenos Aires"
        },
        {
          country: "Brasil",
          flag: "🇧🇷",
          greeting: "Olá!",
          language: "Portugués brasileño",
          city: "São Paulo"
        },
        {
          country: "México",
          flag: "🇲🇽",
          greeting: "¡Qué onda!",
          language: "Español mexicano",
          city: "Ciudad de México"
        },
        {
          country: "España",
          flag: "🇪🇸",
          greeting: "¡Hola!",
          language: "Español castellano",
          city: "Madrid"
        },
        {
          country: "Francia",
          flag: "🇫🇷",
          greeting: "Bonjour!",
          language: "Francés",
          city: "París"
        },
        {
          country: "Alemania",
          flag: "🇩🇪",
          greeting: "Hallo!",
          language: "Alemán",
          city: "Berlín"
        },
        {
          country: "Japón",
          flag: "🇯🇵",
          greeting: "こんにちは",
          language: "Japonés",
          city: "Tokio"
        },
        {
          country: "China",
          flag: "🇨🇳",
          greeting: "你好",
          language: "Mandarín",
          city: "Shanghái"
        },
        {
          country: "India",
          flag: "🇮🇳",
          greeting: "नमस्ते",
          language: "Hindi",
          city: "Mumbai"
        },
        {
          country: "Estados Unidos",
          flag: "🇺🇸",
          greeting: "Hey there!",
          language: "Inglés americano",
          city: "Nueva York"
        },
        {
          country: "Reino Unido",
          flag: "🇬🇧",
          greeting: "Cheerio!",
          language: "Inglés británico",
          city: "Londres"
        },
        {
          country: "Italia",
          flag: "🇮🇹",
          greeting: "Ciao!",
          language: "Italiano",
          city: "Roma"
        }
      ];

      function escapeHtml(text) {
        var map = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" };
        return String(text).replace(/[&<>"']/g, function(char) { return map[char]; });
      }

      function buildCard(item) {
        var article = document.createElement("article");
        article.setAttribute("role", "listitem");
        article.className = "greeting-card";

        var flag = document.createElement("span");
        flag.className = "card-flag";
        flag.setAttribute("aria-hidden", "true");
        flag.textContent = item.flag;

        var greeting = document.createElement("h2");
        greeting.className = "card-greeting";
        greeting.textContent = item.greeting;

        var country = document.createElement("p");
        country.className = "card-country";
        country.textContent = escapeHtml(item.country);

        var city = document.createElement("p");
        city.className = "card-city";
        city.textContent = escapeHtml(item.city);

        var language = document.createElement("span");
        language.className = "card-language";
        language.textContent = escapeHtml(item.language);

        article.appendChild(flag);
        article.appendChild(greeting);
        article.appendChild(country);
        article.appendChild(city);
        article.appendChild(language);

        return article;
      }

      function renderGreetings(data, containerId) {
        var container = document.getElementById(containerId);
        if (!container) { return; }
        var fragment = document.createDocumentFragment();
        for (var i = 0; i < data.length; i++) {
          fragment.appendChild(buildCard(data[i]));
        }
        container.appendChild(fragment);
      }

      function setCurrentYear(spanId) {
        var el = document.getElementById(spanId);
        if (el) { el.textContent = new Date().getFullYear(); }
      }

      renderGreetings(greetingsData, "greetings-grid");
      setCurrentYear("current-year");
    </script>
  </body>
</html>
