<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hola TSOFT — Saludos personalizados por oficina">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 style-src 'self' 'unsafe-inline';
                 script-src 'self' 'unsafe-inline';
                 img-src 'none';
                 object-src 'none'">
  <title>Hola TSOFT</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <span class="brand-logo" aria-label="TSOFT">TSOFT</span>
      <button
        id="lang-toggle"
        class="lang-btn"
        aria-pressed="false"
        aria-label="Cambiar idioma a inglés">
        ES / EN
      </button>
    </div>
  </header>

  <main class="main-content">

    <section class="selector-section" aria-labelledby="selector-title">
      <h1 id="selector-title" class="section-title">
        Selecciona tu oficina
      </h1>

      <div class="dropdown-wrapper">
        <button
          id="dropdown-trigger"
          class="dropdown-trigger"
          aria-haspopup="listbox"
          aria-expanded="false"
          aria-controls="country-listbox">
          <span id="selected-flag" class="flag-display" aria-hidden="true">🌎</span>
          <span id="selected-country-name" class="country-name-display">Elige un país</span>
          <span class="dropdown-arrow" aria-hidden="true">▾</span>
        </button>

        <ul
          id="country-listbox"
          class="country-list"
          role="listbox"
          aria-label="Lista de oficinas TSOFT"
          hidden>
        </ul>
      </div>
    </section>

    <section class="greeting-section" aria-labelledby="greeting-label" aria-live="polite">
      <div id="greeting-card" class="greeting-card" hidden>

        <div class="greeting-flag-display" aria-hidden="true">
          <span id="greeting-flag" class="greeting-flag-emoji"></span>
        </div>

        <p id="greeting-label" class="greeting-country-name"></p>

        <blockquote id="greeting-text" class="greeting-phrase" lang="es"></blockquote>

        <p id="greeting-translation" class="greeting-translation" lang="en"></p>

      </div>

      <div id="greeting-placeholder" class="greeting-placeholder">
        <p class="placeholder-text">👆 Selecciona una oficina para ver el saludo</p>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <p class="footer-text">
      © <span id="footer-year"></span> TSOFT — Todos los derechos reservados
    </p>
  </footer>

  <script src="js/main.js" defer></script>
</body>
</html>
