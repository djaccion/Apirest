<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validador de Prompts — PROYEC-20</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <div class="max-w-2xl mx-auto py-10 px-4">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Validador de Prompts — PROYEC-20</h1>

    <div class="bg-white rounded-xl shadow p-6">
      <form id="prompt-form">
        <label for="prompt-input" class="block text-sm font-medium text-gray-700 mb-2">Ingresa tu prompt:</label>
        <textarea
          id="prompt-input"
          rows="6"
          placeholder="Escribe o pega tu prompt aquí..."
          class="w-full border border-gray-300 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"
        ></textarea>
        <button
          id="submit-btn"
          type="submit"
          class="mt-4 w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
        >Analizar Prompt</button>
      </form>
    </div>

    <div id="results-card" class="bg-white rounded-xl shadow p-6 mt-6 hidden">
      <h2 class="text-lg font-semibold text-gray-800">Resultado del Análisis</h2>
      <div class="grid grid-cols-3 gap-4 mt-4">
        <div class="border rounded-lg p-4 text-center">
          <p class="text-xs text-gray-500 mb-1">Tokens Estimados</p>
          <p id="result-tokens" class="text-xl font-bold text-gray-800">—</p>
        </div>
        <div class="border rounded-lg p-4 text-center">
          <p class="text-xs text-gray-500 mb-1">Latencia Simulada (ms)</p>
          <p id="result-latency" class="text-xl font-bold text-gray-800">—</p>
        </div>
        <div class="border rounded-lg p-4 text-center">
          <p class="text-xs text-gray-500 mb-1">Estado</p>
          <p id="result-status" class="text-xl font-bold text-gray-800">—</p>
        </div>
      </div>
      <div id="error-msg" class="hidden bg-red-100 text-red-700 rounded-lg p-3 mt-4 text-sm"></div>
    </div>
  </div>

  <script>
    const BACKEND_URL = 'http://localhost:8000/api/analyze';

    function setLoading(isLoading) {
      var btn = document.getElementById('submit-btn');
      var input = document.getElementById('prompt-input');
      btn.disabled = isLoading;
      input.disabled = isLoading;
      btn.textContent = isLoading ? 'Analizando...' : 'Analizar Prompt';
    }

    function showError(message) {
      var errorEl = document.getElementById('error-msg');
      var resultsCard = document.getElementById('results-card');
      resultsCard.classList.remove('hidden');
      errorEl.classList.remove('hidden');
      errorEl.textContent = message;
    }

    function hideError() {
      var errorEl = document.getElementById('error-msg');
      errorEl.classList.add('hidden');
      errorEl.textContent = '';
    }

    function renderResults(data) {
      var resultsCard = document.getElementById('results-card');
      resultsCard.classList.remove('hidden');
      hideError();

      document.getElementById('result-tokens').textContent = data.estimated_tokens;
      document.getElementById('result-latency').textContent = data.simulated_latency_ms;

      var statusEl = document.getElementById('result-status');
      statusEl.textContent = data.status;
      if (data.status === 'Alerta') {
        statusEl.className = 'text-xl font-bold text-red-600';
      } else {
        statusEl.className = 'text-xl font-bold text-green-600';
      }
    }

    async function handleSubmit(event) {
      event.preventDefault();

      var prompt = document.getElementById('prompt-input').value.trim();

      if (!prompt) {
        showError('Por favor, ingresa un prompt antes de analizar.');
        return;
      }

      setLoading(true);
      hideError();

      try {
        var response = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ prompt: prompt })
        });

        if (!response.ok) {
          var errorText = 'Error del servidor: ' + response.status + ' ' + response.statusText;
          try {
            var errorData = await response.json();
            if (errorData.detail) {
              errorText = 'Error del servidor: ' + errorData.detail;
            }
          } catch (parseErr) {}
          showError(errorText);
          return;
        }

        var data = await response.json();
        renderResults(data);
      } catch (networkError) {
        showError('No se pudo conectar con el backend. Asegúrate de que el servidor esté corriendo en ' + BACKEND_URL + '.');
      } finally {
        setLoading(false);
      }
    }

    document.getElementById('prompt-form').addEventListener('submit', handleSubmit);
  </script>
</body>
</html>
