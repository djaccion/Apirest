<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Validador de Prompts — PROYEC-20</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-950">
    <div class="max-w-2xl mx-auto py-12 px-6">

      <h1 class="text-3xl font-bold text-white">Validador de Prompts</h1>
      <p class="text-sm text-gray-400 mt-1">Estimación de tokens y latencia · PROYEC-20</p>

      <div class="mt-8">
        <textarea
          id="prompt-input"
          rows="8"
          placeholder="Pega tu prompt aquí..."
          class="bg-gray-800 border border-gray-700 text-white w-full p-4 rounded-lg resize-y focus:outline-none focus:ring-2 focus:ring-indigo-500"
        ></textarea>

        <button
          id="analyze-btn"
          type="button"
          class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold w-full py-3 rounded-lg mt-4 transition-colors cursor-pointer"
        >
          Analizar Prompt
        </button>
      </div>

      <div id="results-panel" class="hidden mt-6 bg-gray-800 border border-gray-700 rounded-lg p-6 space-y-4">
        <div class="flex justify-between items-center">
          <span class="text-gray-400 text-sm">Tokens estimados</span>
          <span id="result-tokens" class="text-white font-bold text-lg">—</span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-gray-400 text-sm">Latencia simulada</span>
          <span id="result-latency" class="text-white font-bold text-lg">—</span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-gray-400 text-sm">Estado</span>
          <span id="result-status" class="font-bold text-lg">—</span>
        </div>
      </div>

      <div id="error-panel" class="hidden mt-6 bg-red-900 border border-red-700 rounded-lg p-4">
        <p id="error-message" class="text-red-300 text-sm"></p>
      </div>

    </div>

    <script>
      const analyzeBtn = document.getElementById('analyze-btn');
      const promptInput = document.getElementById('prompt-input');
      const resultsPanel = document.getElementById('results-panel');
      const errorPanel = document.getElementById('error-panel');
      const resultTokens = document.getElementById('result-tokens');
      const resultLatency = document.getElementById('result-latency');
      const resultStatus = document.getElementById('result-status');
      const errorMessage = document.getElementById('error-message');

      const hideResults = () => {
        resultsPanel.classList.add('hidden');
        errorPanel.classList.add('hidden');
      };

      const showError = (msg) => {
        errorMessage.textContent = msg;
        errorPanel.classList.remove('hidden');
        resultsPanel.classList.add('hidden');
      };

      const showResults = (data) => {
        resultTokens.textContent = data.tokens_estimados;
        resultLatency.textContent = data.latencia_ms + ' ms';

        resultStatus.textContent = data.estado;
        if (data.estado === 'Alerta') {
          resultStatus.className = 'font-bold text-lg text-yellow-400';
        } else {
          resultStatus.className = 'font-bold text-lg text-green-400';
        }

        resultsPanel.classList.remove('hidden');
        errorPanel.classList.add('hidden');
      };

      const setLoadingState = (isLoading) => {
        analyzeBtn.disabled = isLoading;
        analyzeBtn.textContent = isLoading ? 'Analizando...' : 'Analizar Prompt';
        if (isLoading) {
          analyzeBtn.classList.add('opacity-60', 'cursor-not-allowed');
          analyzeBtn.classList.remove('cursor-pointer');
        } else {
          analyzeBtn.classList.remove('opacity-60', 'cursor-not-allowed');
          analyzeBtn.classList.add('cursor-pointer');
        }
      };

      const handleAnalyze = () => {
        const prompt = promptInput.value.trim();

        if (prompt === '') {
          hideResults();
          showError('El campo de prompt no puede estar vacío.');
          return;
        }

        setLoadingState(true);
        hideResults();

        fetch('http://localhost:8000/api/analyze', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ prompt: prompt })
        })
          .then((response) => {
            if (!response.ok) {
              throw new Error('El servidor respondió con estado ' + response.status);
            }
            return response.json();
          })
          .then((data) => {
            showResults(data);
          })
          .catch((err) => {
            showError('No se pudo conectar con el backend. Asegúrate de que el servidor esté corriendo en http://localhost:8000. Detalle: ' + err.message);
          })
          .finally(() => {
            setLoadingState(false);
          });
      };

      analyzeBtn.addEventListener('click', handleAnalyze);
    </script>
  </body>
</html>
