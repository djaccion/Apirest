<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self'; script-src 'self';">
  <meta name="description" content="Saludos TSOFT por país">
  <title>Hola TSOFT</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header>
    <div id="header-brand">
      <span id="brand-name">TSOFT</span>
    </div>
    <p id="brand-tagline">Conectando Latinoamérica con tecnología</p>
  </header>

  <main>
    <h1 id="page-title">Selecciona tu país</h1>

    <div id="country-selector-wrapper">

      <label for="country-select" id="country-label">
        Elige una oficina TSOFT:
      </label>

      <select id="country-select" name="country" aria-labelledby="country-label">
        <option value="" disabled selected>— Seleccionar país —</option>
        <option value="pe" data-flag="🇵🇪">🇵🇪 Perú</option>
        <option value="cl" data-flag="🇨🇱">🇨🇱 Chile</option>
        <option value="co" data-flag="🇨🇴">🇨🇴 Colombia</option>
        <option value="mx" data-flag="🇲🇽">🇲🇽 México</option>
        <option value="ar" data-flag="🇦🇷">🇦🇷 Argentina</option>
        <option value="es" data-flag="🇪🇸">🇪🇸 España</option>
      </select>

    </div>

    <section id="greeting-display" aria-live="polite" aria-atomic="true">
      <div id="greeting-flag"></div>
      <h2 id="greeting-text"></h2>
      <p id="greeting-subtext"></p>
    </section>

  </main>

  <footer>
    <p id="footer-legal">&copy; 2025 TSOFT. Todos los derechos reservados.</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
