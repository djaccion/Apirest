# XP-14 — Configuración Nginx de referencia para producción
# Versión: 1.0.0 | Clasificación: REFERENCIA — no ejecutar en desarrollo local
# Requiere: Nginx >= 1.18 con módulos ssl, headers, rewrite, gzip (paquete estándar)
# Uso: include este archivo desde el nginx.conf principal del servidor
# Placeholders a reemplazar antes de usar:
#   __PLACEHOLDER_DOMAIN__       → dominio(s) del sitio (ej: example.com www.example.com)
#   __PLACEHOLDER_SSL_CERT_PATH__ → ruta absoluta al certificado SSL (ej: /etc/letsencrypt/live/example.com/fullchain.pem)
#   __PLACEHOLDER_SSL_KEY_PATH__  → ruta absoluta a la clave privada SSL (ej: /etc/letsencrypt/live/example.com/privkey.pem)
#   __PLACEHOLDER_SITE_ROOT__    → ruta absoluta al directorio raíz del sitio (ej: /var/www/xp14)

server {
    listen 80;
    listen [::]:80;
    server_name __PLACEHOLDER_DOMAIN__;

    # Redirige TODO el tráfico HTTP a HTTPS de forma permanente
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __PLACEHOLDER_DOMAIN__;

    ssl_certificate     __PLACEHOLDER_SSL_CERT_PATH__;
    ssl_certificate_key __PLACEHOLDER_SSL_KEY_PATH__;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root __PLACEHOLDER_SITE_ROOT__;
    index index.html;

    # HSTS — fuerza HTTPS por 1 año, incluye subdominios
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Impide que el sitio sea embebido en iframes (complementa CSP del meta tag)
    add_header X-Frame-Options "DENY" always;

    # Evita que el navegador adivine el MIME type
    add_header X-Content-Type-Options "nosniff" always;

    # Controla información del Referer enviada a terceros
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Deshabilita funcionalidades de navegador no necesarias
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # CSP de producción — más estricta que el meta tag del HTML
    # IMPORTANTE: sha256 de DOMPurify CDN debe actualizarse si cambia la versión
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://www.googletagmanager.com 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://www.google-analytics.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff|woff2)$ {
        expires 6M;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~* \.(conf|md|git)$ {
        deny all;
        return 404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
}