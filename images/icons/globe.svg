<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Globo terráqueo representando presencia internacional">
  <title>Ícono de globo terráqueo</title>
  <desc>Globo terráqueo estilizado con meridianos y paralelos que representa la presencia internacional de TSOFT en múltiples países de América Latina, España y Estados Unidos</desc>
  <defs>
    <clipPath id="globe-clip">
      <circle cx="32" cy="32" r="27"/>
    </clipPath>
  </defs>
  <g id="globe-icon">
    <circle cx="32" cy="32" r="28" fill="none" stroke="#1A73E8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g clip-path="url(#globe-clip)" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="32" cy="32" rx="11" ry="28" fill="none" stroke="#1A73E8" stroke-width="1.5"/>
      <ellipse cx="32" cy="32" rx="28" ry="8" fill="none" stroke="#5BA4F5" stroke-width="1" stroke-dasharray="3 2"/>
      <line x1="32" y1="4" x2="32" y2="60" fill="none" stroke="#1A73E8" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="4" y1="32" x2="60" y2="32" fill="none" stroke="#5BA4F5" stroke-width="1" stroke-dasharray="3 2" stroke-linecap="round"/>
      <line x1="4" y1="20" x2="60" y2="20" fill="none" stroke="#5BA4F5" stroke-width="1" stroke-dasharray="3 2" stroke-linecap="round"/>
      <line x1="4" y1="44" x2="60" y2="44" fill="none" stroke="#5BA4F5" stroke-width="1" stroke-dasharray="3 2" stroke-linecap="round"/>
    </g>
  </g>
</svg>