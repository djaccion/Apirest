<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60" role="img" aria-labelledby="tsoft-logo-title">
  <title id="tsoft-logo-title">TSOFT Logo</title>

  <defs>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00B4D8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0096C7;stop-opacity:1" />
    </linearGradient>

    <symbol id="logo-dark" viewBox="0 0 200 60">
      <!-- Grupo 1: Isotipo -->
      <g id="isotipo-dark">
        <!-- Base rectangular azul profundo -->
        <rect x="8" y="10" width="36" height="40" rx="4" ry="4" fill="#0A2463"/>
        <!-- Barra horizontal superior de la T -->
        <rect x="11" y="14" width="30" height="7" rx="2" ry="2" fill="url(#accent-gradient)"/>
        <!-- Barra vertical de la T -->
        <rect x="20" y="21" width="12" height="20" rx="2" ry="2" fill="#FFFFFF"/>
        <!-- Nodo superior izquierdo -->
        <circle cx="13" cy="17.5" r="2.5" fill="#FFFFFF"/>
        <!-- Nodo superior derecho -->
        <circle cx="39" cy="17.5" r="2.5" fill="#FFFFFF"/>
        <!-- Línea de circuito inferior -->
        <path d="M14 44 L18 44 L18 41 L34 41 L34 44 L38 44" stroke="#00B4D8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Nodo circuito izquierdo -->
        <circle cx="14" cy="44" r="1.5" fill="#00B4D8"/>
        <!-- Nodo circuito derecho -->
        <circle cx="38" cy="44" r="1.5" fill="#00B4D8"/>
      </g>

      <!-- Grupo 2: Logotipo tipográfico TSOFT como paths -->
      <g id="logotipo-dark" fill="#FFFFFF">
        <!-- Letra T -->
        <path d="M54 16 L54 19.5 L59.5 19.5 L59.5 44 L63.5 44 L63.5 19.5 L69 19.5 L69 16 Z"/>
        <!-- Letra S -->
        <path d="M72 16 L72 19.5 L81 19.5 L81 27.5 L72 27.5 L72 40.5 L72 44 L83 44 L83 40.5 L76 40.5 L76 31.5 L83 31.5 L83 16 Z"/>
        <!-- Letra O -->
        <path d="M86 16 L86 44 L97 44 L97 16 Z M90 19.5 L93 19.5 L93 40.5 L90 40.5 Z"/>
        <!-- Letra F -->
        <path d="M100 16 L100 44 L104 44 L104 32 L112 32 L112 28.5 L104 28.5 L104 19.5 L113 19.5 L113 16 Z"/>
        <!-- Letra T final -->
        <path d="M116 16 L116 19.5 L121.5 19.5 L121.5 44 L125.5 44 L125.5 19.5 L131 19.5 L131 16 Z"/>
      </g>

      <!-- Línea decorativa acento -->
      <rect x="54" y="47" width="77" height="2" rx="1" fill="#00B4D8"/>
    </symbol>

    <symbol id="logo-light" viewBox="0 0 200 60">
      <!-- Grupo 1: Isotipo versión light -->
      <g id="isotipo-light">
        <!-- Base rectangular azul profundo -->
        <rect x="8" y="10" width="36" height="40" rx="4" ry="4" fill="#0A2463"/>
        <!-- Barra horizontal superior de la T -->
        <rect x="11" y="14" width="30" height="7" rx="2" ry="2" fill="#0096C7"/>
        <!-- Barra vertical de la T -->
        <rect x="20" y="21" width="12" height="20" rx="2" ry="2" fill="#FFFFFF"/>
        <!-- Nodo superior izquierdo -->
        <circle cx="13" cy="17.5" r="2.5" fill="#FFFFFF"/>
        <!-- Nodo superior derecho -->
        <circle cx="39" cy="17.5" r="2.5" fill="#FFFFFF"/>
        <!-- Línea de circuito inferior -->
        <path d="M14 44 L18 44 L18 41 L34 41 L34 44 L38 44" stroke="#0096C7" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Nodo circuito izquierdo -->
        <circle cx="14" cy="44" r="1.5" fill="#0096C7"/>
        <!-- Nodo circuito derecho -->
        <circle cx="38" cy="44" r="1.5" fill="#0096C7"/>
      </g>

      <!-- Grupo 2: Logotipo tipográfico TSOFT versión light -->
      <g id="logotipo-light" fill="#0A2463">
        <!-- Letra T -->
        <path d="M54 16 L54 19.5 L59.5 19.5 L59.5 44 L63.5 44 L63.5 19.5 L69 19.5 L69 16 Z"/>
        <!-- Letra S -->
        <path d="M72 16 L72 19.5 L81 19.5 L81 27.5 L72 27.5 L72 40.5 L72 44 L83 44 L83 40.5 L76 40.5 L76 31.5 L83 31.5 L83 16 Z"/>
        <!-- Letra O -->
        <path d="M86 16 L86 44 L97 44 L97 16 Z M90 19.5 L93 19.5 L93 40.5 L90 40.5 Z"/>
        <!-- Letra F -->
        <path d="M100 16 L100 44 L104 44 L104 32 L112 32 L112 28.5 L104 28.5 L104 19.5 L113 19.5 L113 16 Z"/>
        <!-- Letra T final -->
        <path d="M116 16 L116 19.5 L121.5 19.5 L121.5 44 L125.5 44 L125.5 19.5 L131 19.5 L131 16 Z"/>
      </g>

      <!-- Línea decorativa acento -->
      <rect x="54" y="47" width="77" height="2" rx="1" fill="#0096C7"/>
    </symbol>
  </defs>

  <!-- Instancia principal: versión dark (contexto header) -->
  <use href="#logo-dark" x="0" y="0" width="200" height="60"/>
</svg>