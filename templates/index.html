<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador RUT Chileno</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self';">
    <style>
        :root {
            --color-bg: #1a1a2e;
            --color-card: #16213e;
            --color-accent-blue: #0f3460;
            --color-accent-vibrant: #e94560;
            --color-accent-vibrant-hover: #c73652;
            --color-valid: #00b894;
            --color-invalid: #d63031;
            --color-warning: #e17055;
            --color-text: #f0f0f0;
            --color-text-muted: rgba(240, 240, 240, 0.55);
            --color-input-bg: rgba(15, 52, 96, 0.4);
            --color-input-border: rgba(233, 69, 96, 0.3);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--color-bg);
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            color: var(--color-text);
        }

        .card {
            width: 90%;
            max-width: 480px;
            padding: 40px 35px;
            border-radius: 16px;
            background-color: var(--color-card);
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(233, 69, 96, 0.08),
                0 4px 20px rgba(233, 69, 96, 0.07);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
            color: var(--color-text);
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--color-text-muted);
            text-align: center;
            margin-bottom: 32px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label[for="rut-input"] {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--color-text-muted);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        #rut-input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 10px;
            border: 2px solid var(--color-input-border);
            background: var(--color-input-bg);
            color: var(--color-text);
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            letter-spacing: 2px;
        }

        #rut-input::placeholder {
            color: rgba(240, 240, 240, 0.25);
            letter-spacing: 1px;
        }

        #rut-input:focus {
            border-color: var(--color-accent-vibrant);
            box-shadow: 0 0 0 3px rgba(233, 69, 96, 0.18);
        }

        #rut-input.input-error {
            border-color: var(--color-invalid);
        }

        #rut-input.input-error:focus {
            border-color: var(--color-invalid);
            box-shadow: 0 0 0 3px rgba(214, 48, 49, 0.18);
        }

        #rut-input.input-valid {
            border-color: var(--color-valid);
        }

        #rut-input.input-valid:focus {
            border-color: var(--color-valid);
            box-shadow: 0 0 0 3px rgba(0, 184, 148, 0.18);
        }

        .input-help {
            display: block;
            font-size: 0.78rem;
            color: var(--color-text-muted);
            text-align: center;
            margin-top: 6px;
        }

        #validate-btn {
            width: 100%;
            padding: 15px;
            margin-top: 24px;
            border: none;
            border-radius: 10px;
            background-color: var(--color-accent-vibrant);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
            transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.3);
        }

        #validate-btn:hover {
            background-color: var(--color-accent-vibrant-hover);
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(233, 69, 96, 0.45);
        }

        #validate-btn:active {
            transform: scale(0.98);
        }

        #validate-btn.loading {
            cursor: not-allowed;
            opacity: 0.65;
            transform: none !important;
            box-shadow: none;
        }

        #validate-btn.loading:hover {
            background-color: var(--color-accent-vibrant);
            transform: none;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #result-container {
            display: none;
            margin-top: 24px;
            padding: 18px 22px;
            border-radius: 10px;
            border-left: 4px solid transparent;
            background: rgba(15, 52, 96, 0.35);
        }

        #result-container.visible {
            display: block;
            animation: fadeInDown 0.4s ease;
        }

        #result-container.result-valid {
            border-left-color: var(--color-valid);
            background: rgba(0, 184, 148, 0.08);
        }

        #result-container.result-invalid {
            border-left-color: var(--color-invalid);
            background: rgba(214, 48, 49, 0.08);
        }

        #result-container.result-warning {
            border-left-color: var(--color-warning);
            background: rgba(225, 112, 85, 0.08);
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .result-icon {
            font-size: 1.3rem;
            line-height: 1;
        }

        .result-title {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        #result-container.result-valid .result-title {
            color: var(--color-valid);
        }

        #result-container.result-invalid .result-title {
            color: var(--color-invalid);
        }

        #result-container.result-warning .result-title {
            color: var(--color-warning);
        }

        .result-message {
            font-size: 0.88rem;
            color: var(--color-text-muted);
            line-height: 1.5;
        }

        .result-rut-formatted {
            display: inline-block;
            margin-top: 8px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--color-text);
            letter-spacing: 1.5px;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 12px;
            border-radius: 6px;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.06);
            margin: 28px 0 0 0;
        }

        .footer-note {
            margin-top: 16px;
            font-size: 0.75rem;
            color: var(--color-text-muted);
            text-align: center;
            line-height: 1.6;
        }

        @media (max-width: 480px) {
            .card {
                padding: 32px 22px;
            }

            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="card" role="main">
        <h1>Validador RUT</h1>
        <p class="subtitle">Verificación de RUT chileno con algoritmo módulo 11</p>

        <div class="form-group">
            <label for="rut-input">Ingresa el RUT</label>
            <input
                type="text"
                id="rut-input"
                name="rut"
                placeholder="12345678-9"
                maxlength="12"
                autocomplete="off"
                spellcheck="false"
                aria-describedby="rut-help"
                aria-label="Campo de ingreso de RUT chileno"
            >
            <span class="input-help" id="rut-help">Formato: 12345678-K &nbsp;|&nbsp; Sin puntos, con guion</span>
        </div>

        <button
            type="button"
            id="validate-btn"
            aria-live="polite"
            aria-label="Validar RUT ingresado"
        >
            Validar RUT
        </button>

        <div
            id="result-container"
            role="alert"
            aria-live="assertive"
            aria-atomic="true"
        >
            <div class="result-header">
                <span class="result-icon" id="result-icon" aria-hidden="true"></span>
                <span class="result-title" id="result-title"></span>
            </div>
            <p class="result-message" id="result-message"></p>
            <span class="result-rut-formatted" id="result-rut-formatted" style="display:none;"></span>
        </div>

        <div class="divider"></div>
        <p class="footer-note">
            Los datos ingresados no son almacenados.<br>
            Validación realizada en servidor con algoritmo estándar chileno.
        </p>
    </div>

    <script>
        (function () {
            'use strict';

            const rutInput = document.getElementById('rut-input');
            const validateBtn = document.getElementById('validate-btn');
            const resultContainer = document.getElementById('result-container');
            const resultIcon = document.getElementById('result-icon');
            const resultTitle = document.getElementById('result-title');
            const resultMessage = document.getElementById('result-message');
            const resultRutFormatted = document.getElementById('result-rut-formatted');

            const FORMAT_REGEX = /^[0-9]{1,8}-[0-9Kk]$/;

            function sanitizeInput(value) {
                return value.replace(/[^0-9Kk\-]/g, '').trim();
            }

            function formatRutInput(value) {
                let clean = value.replace(/[^0-9Kk]/g, '');
                if (clean.length > 1) {
                    const body = clean.slice(0, -1);
                    const dv = clean.slice(-1).toUpperCase();
                    return body + '-' + dv;
                }
                return clean;
            }

            function clearResultState() {
                rutInput.classList.remove('input-error', 'input-valid');
                resultContainer.classList.remove('visible', 'result-valid', 'result-invalid', 'result-warning');
                resultRutFormatted.style.display = 'none';
                resultRutFormatted.textContent = '';
                resultIcon.textContent = '';
                resultTitle.textContent = '';
                resultMessage.textContent = '';
            }

            function showResult(type, icon, title, message, rutFormatted) {
                resultContainer.classList.remove('result-valid', 'result-invalid', 'result-warning', 'visible');

                void resultContainer.offsetWidth;

                resultIcon.textContent = icon;
                resultTitle.textContent = title;
                resultMessage.textContent = message;

                if (rutFormatted) {
                    resultRutFormatted.textContent = rutFormatted;
                    resultRutFormatted.style.display = 'inline-block';
                } else {
                    resultRutFormatted.style.display = 'none';
                    resultRutFormatted.textContent = '';
                }

                resultContainer.classList.add('result-' + type, 'visible');

                if (type === 'valid') {
                    rutInput.classList.remove('input-error');
                    rutInput.classList.add('input-valid');
                } else if (type === 'invalid') {
                    rutInput.classList.remove('input-valid');
                    rutInput.classList.add('input-error');
                } else {
                    rutInput.classList.remove('input-valid', 'input-error');
                }
            }

            function setLoading(isLoading) {
                if (isLoading) {
                    validateBtn.classList.add('loading');
                    validateBtn.disabled = true;
                    validateBtn.innerHTML = '<span class="spinner" aria-hidden="true"></span>Validando...';
                } else {
                    validateBtn.classList.remove('loading');
                    validateBtn.disabled = false;
                    validateBtn.textContent = 'Validar RUT';
                }
            }

            async function validateRut() {
                const rawValue = rutInput.value;
                const sanitized = sanitizeInput(rawValue);

                if (!sanitized) {
                    showResult('warning', '⚠️', 'Campo vacío', 'Por favor ingresa un RUT para validar.', null);
                    rutInput.focus();
                    return;
                }

                if (!FORMAT_REGEX.test(sanitized)) {
                    showResult(
                        'warning',
                        '⚠️',
                        'Formato incorrecto',
                        'El formato ingresado no es válido. Usa el formato: 12345678-K (sin puntos, con guion y dígito verificador).',
                        null
                    );
                    rutInput.classList.remove('input-valid');
                    rutInput.classList.add('input-error');
                    return;
                }

                setLoading(true);
                clearResultState();

                try {
                    const response = await fetch('/api/validate-rut', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json',
                            'X-Requested-With': 'XMLHttpRequest'
                        },
                        body: JSON.stringify({ rut: sanitized })
                    });

                    let data;
                    try {
                        data = await response.json();
                    } catch {
                        throw new Error('La respuesta del servidor no es válida.');
                    }

                    if (response.status === 429) {
                        showResult(
                            'warning',
                            '⏳',
                            'Demasiadas solicitudes',
                            'Has realizado demasiadas validaciones en poco tiempo. Por favor espera unos segundos e intenta nuevamente.',
                            null
                        );
                        return;
                    }

                    if (!response.ok && response.status !== 400) {
                        throw new Error(data.message || 'Error inesperado en el servidor.');
                    }

                    if (data.valid === true) {
                        showResult(
                            'valid',
                            '✅',
                            'RUT Válido',
                            data.message || 'El RUT ingresado es válido.',
                            data.rut_formateado || null
                        );
                    } else {
                        showResult(
                            'invalid',
                            '❌',
                            'RUT Inválido',
                            data.message || 'El RUT ingresado no es válido.',
                            data.rut_formateado || null
                        );
                    }

                } catch (error) {
                    showResult(
                        'warning',
                        '🔌',
                        'Error de conexión',
                        error.message || 'No se pudo conectar con el servidor. Verifica tu conexión e intenta nuevamente.',
                        null
                    );
                } finally {
                    setLoading(false);
                }
            }

            rutInput.addEventListener('input', function () {
                const cursorPos = this.selectionStart;
                const prevLength = this.value.length;

                let clean = this.value.replace(/[^0-9Kk\-]/g, '');
                const dashCount = (clean.match(/-/g) || []).length;
                if (dashCount > 1) {
                    clean = clean.replace(/-/g, '');
                    if (clean.length > 1) {
                        clean = clean.slice(0, -1) + '-' + clean.slice(-1);
                    }
                }

                if (this.value !== clean) {
                    this.value = clean;
                    const newPos = cursorPos - (prevLength - clean.length);
                    this.setSelectionRange(Math.max(0, newPos), Math.max(0, newPos));
                }

                if (this.classList.contains('input-error') || this.classList.contains('input-valid')) {
                    this.classList.remove('input-error', 'input-valid');
                }

                if (resultContainer.classList.contains('visible')) {
                    resultContainer.classList.remove('visible');
                    setTimeout(() => {
                        resultContainer.classList.remove('result-valid', 'result-invalid', 'result-warning');
                    }, 300);
                }
            });

            rutInput.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    validateRut();
                }
            });

            validateBtn.addEventListener('click', function () {
                validateRut();
            });

            rutInput.addEventListener('paste', function (e) {
                e.preventDefault();
                const pasted = (e.clipboardData || window.clipboardData).getData('text');
                const clean = sanitizeInput(pasted).replace(/\./g, '');
                const formatted = formatRutInput(clean.replace(/-/g, ''));
                this.value = formatted.toUpperCase();
                this.dispatchEvent(new Event('input'));
            });

        })();
    </script>
</body>
</html>
