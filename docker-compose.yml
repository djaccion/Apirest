# =============================================================================
# Proyecto: XP-9 API - Node.js + Express.js RESTful Service
# Ticket Jira: XP-9
# Descripción: Orquestación de servicios para entorno de desarrollo y pruebas
#              locales. Define el servicio principal de la API y anticipa la
#              integración futura con MongoDB.
#
# ADVERTENCIA DE SEGURIDAD:
#   Los secretos y variables sensibles se gestionan exclusivamente mediante el
#   archivo .env ubicado en la raíz del proyecto. Este archivo NUNCA debe
#   commitearse al repositorio (verificar .gitignore). En entornos de producción,
#   migrar todos los secretos a Docker Secrets o un gestor externo como
#   HashiCorp Vault o AWS Secrets Manager.
#
# Uso básico:
#   Iniciar servicios con rebuild:  docker-compose up --build
#   Detener y eliminar contenedores: docker-compose down
#   Ver logs en tiempo real:        docker-compose logs -f api
# =============================================================================

version: "3.8"

services:

  # ---------------------------------------------------------------------------
  # Servicio principal: API Node.js + Express.js
  # NOTA: El contenedor no se ejecuta como root. Esta restricción se define
  #       en el Dockerfile mediante la directiva USER. Se documenta aquí para
  #       trazabilidad DevSecOps (Ticket XP-9).
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
    container_name: xp9-api
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:${PORT:-3000}/api/v1/health || wget -qO- http://localhost:${PORT:-3000}/api/v1/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - xp9-network

  # ---------------------------------------------------------------------------
  # Servicio futuro: MongoDB
  # ESTADO: Comentado. Se habilitará en la siguiente iteración junto con la
  #         integración de Mongoose como ODM. Descomentar este bloque completo
  #         cuando se implemente la capa de modelos y servicios de base de datos.
  #
  # mongo:
  #   image: mongo:7.0
  #   container_name: xp9-mongo
  #   restart: unless-stopped
  #   ports:
  #     - "${MONGO_PORT:-27017}:27017"
  #   environment:
  #     MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
  #     MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
  #     MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
  #   volumes:
  #     - mongo-data:/data/db
  #   networks:
  #     - xp9-network
  # ---------------------------------------------------------------------------

# =============================================================================
# Redes personalizadas
# Se define una red bridge explícita para aislar la comunicación entre servicios
# y evitar el uso de la red default de Docker. Los servicios futuros (MongoDB,
# Redis, API Gateway) se comunicarán entre sí por nombre de servicio sin
# necesidad de exponer puertos adicionales al host.
# =============================================================================
networks:
  xp9-network:
    driver: bridge
    name: xp9-network

# =============================================================================
# Volúmenes nombrados
# Se declara el volumen de persistencia de MongoDB a nivel raíz para evitar
# errores de validación cuando se descomente el servicio en la siguiente
# iteración. Los volúmenes nombrados garantizan que los datos persistan entre
# reinicios y recreaciones del contenedor.
# =============================================================================
volumes:
  mongo-data:
    driver: local